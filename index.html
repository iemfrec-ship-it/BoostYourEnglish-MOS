<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Boost Your English — MOS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#e8e8e8;--bg1:#d8d8d8;--bg2:#cecece;--bg3:#c2c2c2;--bg4:#f2f2f2;--border:#b0b0b0;--text1:#111;--text2:#333;--text3:#666;--accent:#1a5fa8;--accent2:#144d8a;--gold:#9a6e00;--green:#1a6e3a;--red:#a82020;--vocab:#0e7272;--grammar:#6b3eac;--reading:#b84800;--r:10px;--r2:16px;}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text1);min-height:100vh}
button{cursor:pointer;font-family:'Outfit',sans-serif;border:none;transition:all .18s}
input,select,textarea{font-family:'Outfit',sans-serif;background:var(--bg3);border:1px solid var(--border);color:var(--text1);border-radius:var(--r);padding:.6rem 1rem;font-size:.95rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
h2,h3{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
#app{min-height:100vh}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:32px;width:100%;max-width:420px}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
.flex-col{display:flex;flex-direction:column;min-height:100vh}
.page{flex:1;padding:22px;max-width:820px;margin:0 auto;width:100%}
.btn{padding:.6rem 1.3rem;border-radius:var(--r);font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:all .18s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;border:none;background:rgba(168,32,32,.1);color:var(--red)}
.btn-icon:hover{background:rgba(168,32,32,.2)}
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--bg0);padding:20px 20px 70px}
.home-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.home-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.flags{display:flex;gap:12px;margin-bottom:26px}
.flag{width:52px;height:34px;border-radius:6px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.flag svg{width:100%;height:100%}
.home-title{font-family:'Space Grotesk',sans-serif;font-size:2.6rem;font-weight:700;text-align:center;line-height:1.1;max-width:500px}
.boost{color:var(--accent)}
.mos-badge{display:inline-block;background:var(--accent);color:#fff;font-size:.95rem;padding:3px 12px;border-radius:20px;vertical-align:middle;margin-left:8px;font-weight:600}
.home-sub{color:var(--text3);font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}
.home-cards{display:flex;gap:14px;margin-top:40px}
@media(max-width:520px){.home-cards{flex-direction:column;width:100%;max-width:320px}.home-title{font-size:1.9rem}}
.home-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:24px 28px;text-align:center;cursor:pointer;transition:all .22s;flex:1;min-width:150px}
.home-card:hover{border-color:var(--accent);background:var(--bg2);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.home-card .ci{font-size:2rem;margin-bottom:8px}
.home-card h3{font-size:1rem;margin-bottom:4px}
.home-card p{color:var(--text3);font-size:.8rem}
.hcard-btn{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;font-size:.76rem;font-weight:600}
.home-footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--bg1);border-top:1px solid var(--border);z-index:1}
.credit{color:var(--text3);font-size:.77rem}
.btn-rgpd{background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:20px;padding:5px 14px;font-size:.76rem;cursor:pointer}
.btn-rgpd:hover{border-color:var(--accent);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:32px;width:100%;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:6px}.modal p{color:var(--text3);font-size:.88rem;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.cat-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.cat-tab{padding:7px 16px;border-radius:20px;font-size:.83rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg2);transition:all .18s}
.ct-all.on{background:rgba(26,95,168,.1);border-color:var(--accent);color:var(--accent)}
.ct-vocab.on{background:rgba(14,114,114,.12);border-color:var(--vocab);color:var(--vocab)}
.ct-grammar.on{background:rgba(107,62,172,.12);border-color:var(--grammar);color:var(--grammar)}
.ct-reading.on{background:rgba(184,72,0,.12);border-color:var(--reading);color:var(--reading)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
.theme-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;transition:all .22s}
.theme-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.tc-vocab:hover{border-color:var(--vocab)}.tc-grammar:hover{border-color:var(--grammar)}.tc-reading:hover{border-color:var(--reading)}
.tc-icon{font-size:1.5rem;margin-bottom:7px}.tc-name{font-size:.9rem;font-weight:600;margin-bottom:3px}.tc-count{color:var(--text3);font-size:.76rem}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:9px;overflow:hidden}
.pf-vocab{height:100%;border-radius:2px;background:var(--vocab);transition:width .4s}
.pf-grammar{height:100%;border-radius:2px;background:var(--grammar);transition:width .4s}
.pf-reading{height:100%;border-radius:2px;background:var(--reading);transition:width .4s}
.prog-lbl{font-size:.71rem;color:var(--text3);margin-top:4px}
.xp-pill{display:flex;align-items:center;gap:6px;background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);border-radius:20px;padding:4px 12px;font-size:.83rem;font-weight:600;color:var(--gold)}
.app-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;color:var(--accent)}
.prof-badge{background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);color:var(--gold);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
.ex-box{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:16px}
.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ex-q{font-size:1.05rem;margin-bottom:16px;line-height:1.65}
.type-badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;text-transform:uppercase}
.tb-qcm{background:rgba(26,95,168,.12);color:var(--accent)}
.tb-match{background:rgba(14,114,114,.12);color:var(--vocab)}
.tb-fill{background:rgba(107,62,172,.12);color:var(--grammar)}
.tb-error{background:rgba(168,32,32,.12);color:var(--red)}
.tb-reading{background:rgba(184,72,0,.12);color:var(--reading)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;cursor:pointer;text-align:left;font-size:.92rem;color:var(--text1);width:100%;transition:all .18s}
.choice:hover{background:var(--bg3);border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:rgba(26,95,168,.09)}
.choice.ok{border-color:var(--green);background:rgba(26,110,58,.09);color:var(--green)}
.choice.ko{border-color:var(--red);background:rgba(168,32,32,.09);color:var(--red)}
.blank-inp{border:none;border-bottom:2px solid var(--accent);background:transparent;text-align:center;font-size:.95rem;padding:.3rem .4rem;margin:0 3px;color:var(--text1);outline:none;width:130px;font-family:'Outfit',sans-serif}
.fill-sent{font-size:1rem;line-height:2.6;margin-bottom:16px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.match-col-title{font-size:.76rem;color:var(--text3);margin-bottom:4px;font-weight:600}
.mi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;cursor:pointer;font-size:.86rem;transition:all .18s;min-height:40px;display:flex;align-items:center}
.mi:hover{border-color:var(--accent)}
.mi-sel{border-color:var(--gold)!important;background:rgba(154,110,0,.09);color:var(--gold)}
.mi-ok{border-color:var(--green)!important;background:rgba(26,110,58,.09);color:var(--green);pointer-events:none}
.error-sent{font-size:1rem;line-height:1.9;background:var(--bg2);padding:13px 16px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px}
.ew{cursor:pointer;padding:1px 4px;border-radius:4px;border:1px solid transparent;transition:all .15s;display:inline}
.ew:hover{background:rgba(168,32,32,.1);border-color:rgba(168,32,32,.3)}
.ew-sel{background:rgba(168,32,32,.14);color:var(--red);font-weight:600;border-color:var(--red)}
.ew-ok{background:rgba(26,110,58,.12);color:var(--green);font-weight:600;border-color:var(--green)}
.ew-ko{background:rgba(168,32,32,.12);color:var(--red);border-color:var(--red)}
.feedback{border-left:4px solid;border-radius:var(--r);padding:12px 15px;margin-top:12px;font-size:.87rem;line-height:1.7;background:var(--bg2)}
.fb-ok{border-color:var(--green);color:var(--green)}.fb-ko{border-color:var(--red);color:var(--text1)}
.fb-exp{color:var(--text2);margin-top:5px}
.score-box{text-align:center;padding:20px;background:var(--bg2);border-radius:var(--r2);margin-top:12px}
.score-big{font-size:2.6rem;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--gold)}
.seq-prog{height:4px;background:var(--bg3);border-radius:2px;margin-bottom:14px;overflow:hidden}
.sp-g{height:100%;border-radius:2px;background:var(--grammar);transition:width .3s}
.sp-r{height:100%;border-radius:2px;background:var(--red);transition:width .3s}
.pdf-text{background:#fff;color:#222;padding:18px;font-size:.88rem;line-height:1.85;max-height:320px;overflow-y:auto;border-radius:var(--r);border:1px solid var(--border);white-space:pre-wrap;margin-bottom:14px}
.res-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center}
.stat-val{font-size:1.8rem;font-weight:700;font-family:'Space Grotesk',sans-serif}
.stat-lbl{font-size:.75rem;color:var(--text3);margin-top:2px}
.res-sec-hd{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--r);margin-bottom:8px;font-weight:600;font-size:.88rem;border-left:4px solid}
.rsh-vocab{background:rgba(14,114,114,.09);border-color:var(--vocab);color:var(--vocab)}
.rsh-grammar{background:rgba(107,62,172,.09);border-color:var(--grammar);color:var(--grammar)}
.rsh-reading{background:rgba(184,72,0,.09);border-color:var(--reading);color:var(--reading)}
.res-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.sp{padding:3px 8px;border-radius:20px;font-size:.75rem;font-weight:600}
.sp-hi{background:rgba(26,110,58,.13);color:var(--green)}
.sp-md{background:rgba(154,110,0,.13);color:var(--gold)}
.sp-lo{background:rgba(168,32,32,.13);color:var(--red)}
.mini-bar{height:5px;background:var(--bg3);border-radius:3px;width:70px;display:inline-block;vertical-align:middle;margin-left:7px;overflow:hidden}
.accordion{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:10px}
.acc-head{padding:14px 17px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .18s}
.acc-head:hover{background:var(--bg2)}
.acc-body{padding:0 17px 17px;border-top:1px solid var(--border)}
.ex-row{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--bg2);border-radius:var(--r);margin-top:7px}
.ex-row-info{flex:1}.ex-row-name{font-size:.87rem;font-weight:500;margin-bottom:2px}.ex-row-meta{font-size:.73rem;color:var(--text3)}
.vocab-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;font-size:.82rem;line-height:1.85;max-height:180px;overflow-y:auto;color:var(--text2);white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.71rem;font-weight:500}
.tag-vocab{background:rgba(14,114,114,.12);color:var(--vocab)}
.tag-grammar{background:rgba(107,62,172,.12);color:var(--grammar)}
.tag-reading{background:rgba(184,72,0,.12);color:var(--reading)}
.notif{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--r);padding:11px 16px;font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.16);z-index:200;max-width:280px}
.notif-ok{border-left:3px solid var(--green);color:var(--green)}
.notif-er{border-left:3px solid var(--red);color:var(--red)}
.notif-in{border-left:3px solid var(--accent);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .ei{font-size:2.4rem;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.tm{color:var(--text3)}.fw6{font-weight:600}
.id-preview{text-align:center;margin-bottom:12px;padding:7px;background:var(--bg2);border-radius:var(--r);font-size:1.1rem;font-weight:700;color:var(--accent);letter-spacing:3px;display:none}
.ref-modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:28px;width:100%;max-width:560px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:88vh;overflow-y:auto}
.ref-section{margin-bottom:14px}
.ref-label{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.ref-item{font-size:.85rem;line-height:1.65;margin-bottom:5px;padding:5px 10px;background:var(--bg2);border-radius:var(--r)}
.ref-item-border{border-left:3px solid}
.ref-signals{font-size:.84rem;line-height:1.65;padding:6px 10px;border-radius:var(--r);border-left:3px solid var(--vocab);background:rgba(14,114,114,.07)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ain{animation:slideUp .22s ease both}
</style>
</head>

h specific past time (yesterday). Remove 'yesterday' or use Past Simple: filed a report yesterday."},{"sentence":"We haven't received confirmation from the authorities yet.","errorWord":"haven't","correction":"haven't","explanation":"This sentence is correct! Haven't + past participle + yet = correct negative Present Perfect."},{"sentence":"The customs team have just intercepted a suspicious vehicle at the border.","errorWord":"have","correction":"has","explanation":"'The customs team' (singular collective) \u2192 has just intercepted."},{"sentence":"She has worked as a prison officer since five years.","errorWord":"since","correction":"for","explanation":"'For' is used with a duration (five years). 'Since' is used with a point in time (2018, Monday)."},{"sentence":"Has the fire safety officer complete all mandatory inspections?","errorWord":"complete","correction":"completed","explanation":"Present Perfect question: Has + subject + PAST PARTICIPLE \u2192 completed (not base verb)."},{"sentence":"The security company has recently deploy drones for perimeter surveillance.","errorWord":"deploy","correction":"deployed","explanation":"Present Perfect: has + PAST PARTICIPLE \u2192 deployed (not base verb)."},{"sentence":"He hasn't wrote his incident report yet.","errorWord":"wrote","correction":"written","explanation":"Present Perfect: hasn't + PAST PARTICIPLE \u2192 written (not past simple 'wrote')."},{"sentence":"The investigators have already interview three key witnesses.","errorWord":"interview","correction":"interviewed","explanation":"Present Perfect: have + PAST PARTICIPLE \u2192 interviewed (not base verb)."},{"sentence":"Have you ever worked on a joint operation with international partners?","errorWord":"worked","correction":"worked","explanation":"This sentence is correct! Have + you + ever + past participle? = correct."},{"sentence":"The coast guard has rescue over thirty people so far this year.","errorWord":"rescue","correction":"rescued","explanation":"Pr orrow","explanation":"I + am + not + going to + base verb + object + time."},{"words":["going","Are","the","security","officers","to","conduct","a","surprise","inspection","tomorrow","morning","?"],"answer":"Are the security officers going to conduct a surprise inspection tomorrow morning?","explanation":"Are + subject + going to + base verb + object + time?"},{"words":["is","The","perimeter","sensor","beeping","\u2014","going","to","trigger","it","an","alert","!"],"answer":"The perimeter sensor is beeping - it is going to trigger an alert!","explanation":"Imminent prediction: subject + is + going to + base verb + object."}],"points":10,"explanation":"Is/Are + subject + going to + base verb? Subject + is/are + (not) + going to + base verb + object + time."},{"name":"Future with GOING TO - Find the Error (1)","type":"qcm_sequence","questions":[{"question":"Which sentence is correct?","choices":["The security director is going to introduces a new system.","The security director going to introduce a new system.","The security director is going to introduce a new system.","The security director are going to introduce a new system."],"answer":2,"explanation":"After going to: BASE verb \u2192 introduce (not introduces). Singular: is (not are)."},{"question":"Which sentence is correct?","choices":["Are the compliance officer going to audit all departments?","Is the compliance officer going to audit all departments?","Is the compliance officer going to audits all departments?","Does the compliance officer going to audit all departments?"],"answer":1,"explanation":"Singular subject \u2192 Is. After going to: base verb audit (not audits)."},{"question":"Which sentence is correct?","choices":["The officers aren't going to use the old patrol route.","The officers isn't going to use the old patrol route.","The officers aren't going to uses the old patrol route.","The officers not going to use the old patrol route."],"answer":0,"explanation":"Plural: aren't (not isn't). After going to: base verb use (not uses)."},{"question":"Which sentence is correct?","choices":["Look \u2014 he is going run towards the exit!","Look \u2014 he going to run towards the exit!","Look \u2014 he is going to run towards the exit!","Look \u2014 he is going to runs towards the exit!"],"answer":2,"explanation":"Full structure: is + going + TO + base verb. After going to: base verb run (not runs)."},{"question":"Which sentence is correct?","choices":["Is you going to attend the mandatory training?","Are you going to attend the mandatory training?","Are you going to attends the mandatory training?","Do you going to attend the mandatory training?"],"answer":1,"explanation":"You \u2192 Are. After going to: base verb attend (not attends)."},{"question":"Which sentence is correct?","choices":["The company isn't going to not renew the contract.","The company is not going to renew the contract.","The company is going to not renew the contract.","The company isn't going renew to the contract."],"answer":1,"explanation":"Negative: is + NOT + going to + base verb. Don't add extra 'not'."},{"question":"Which sentence is correct?","choices":["Are the guards going to switches to a four-shift rotation?","Is the guards going to switch to a four-shift rotation?","Are the guards going to switch to a four-shift rotation?","Do the guards going to switch to a four-shift rotation?"],"answer":2,"explanation":"Plural: Are. After going to: base verb switch (not switches)."},{"question":"Which sentence is correct?","choices":["The risk assessment team are going to present its findings.","The risk assessment team is going to presents its findings.","The risk assessment team is going to present its findings.","The risk assessment team is going present to its findings."],"answer":2,"explanation":"Singular collective: is. After going to: base verb present (not presents). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["I am not going to be available for the drill.","I is not going to be available for the drill.","I am not going to being available for the drill.","I am going to not be available for the drill."],"answer":0,"explanation":"I \u2192 am. Not goes before 'going to': am NOT going to be. After going to: base verb be (not being)."},{"question":"Which sentence is correct?","choices":["Is the new PPE going to distributed by Friday?","Is the new PPE going to be distributed by Friday?","Are the new PPE going to be distributed by Friday?","Is the new PPE going to be distribute by Friday?"],"answer":1,"explanation":"Passive: going to + BE + past participle (distributed). Singular: Is."},{"question":"Which sentence is correct?","choices":["The surveillance system is going to not function during maintenance.","The surveillance system not is going to function during maintenance.","The surveillance system is not going to function during maintenance.","The surveillance system is going to function not during maintenance."],"answer":2,"explanation":"Negative: is + NOT + going to + base verb. 'Not' comes before 'going to'."},{"question":"Which sentence is correct?","choices":["The HR manager is going to organises a workshop for all officers.","The HR manager is going to organise a workshop for all officers.","The HR manager are going to organise a workshop for all officers.","The HR manager is going organise to a workshop for all officers."],"answer":1,"explanation":"Singular: is. After going to: base verb organise (not organises). Full structure: going TO + base verb."}],"points":10,"explanation":"After going to: always BASE verb (no -s, no -ed). is/are confusion. Missing 'to'. 'Not' before 'going to'. Going to \u2260 gonna in formal writing."},{"name":"Future with GOING TO - Find the Error (2)","type":"qcm_sequence","questions":[{"question":"Which sentence is correct?","choices":["Is the management team going to extends the current security contract?","Are the management team going to extend the current security contract?","Is the management team going to extend the current security contract?","Does the management team going to extend the current security contract?"],"answer":2,"explanation":"Singular collective: Is. After going to: base verb extend (not extends)."},{"question":"Which sentence is correct?","choices":["Officers aren't going to carries out the drill until exits are checked.","Officers aren't going to carry out the drill until exits are checked.","Officers isn't going to carry out the drill until exits are checked.","Officers aren't going carry to out the drill until exits are checked."],"answer":1,"explanation":"Plural: aren't. After going to: base verb carry out (not carries out). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["Look at that scaffolding \u2014 it are going to collapse!","Look at that scaffolding \u2014 it is going to collapsing!","Look at that scaffolding \u2014 it is going to collapse!","Look at that scaffolding \u2014 it is going collapse to!"],"answer":2,"explanation":"Singular: is. After going to: base verb collapse (not collapsing). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["Are all officers going to receives updated training next quarter?","Is all officers going to receive updated training next quarter?","Are all officers going to receive updated training next quarter?","Do all officers going to receive updated training next quarter?"],"answer":2,"explanation":"Plural: Are. After going to: base verb receive (not receives)."},{"question":"Which sentence is correct?","choices":["The company is going to expand its security operations to three new sites.","The company are going to expand its security operations to three new sites.","The company is going to expands its security operations to three new sites.","The company is going expand to its security operations to three new sites."],"answer":0,"explanation":"Singular: is. After going to: base verb expand (not expands). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["The investigation team aren't going to release its findings yet.","The investigation team isn't going to release its findings yet.","The investigation team isn't going to releases its findings yet.","The investigation team is going to not release its findings yet."],"answer":1,"explanation":"Singular collective: isn't. After going to: base verb release (not releases). 'Not' before 'going to'."},{"question":"Which sentence is correct?","choices":["Is the new head of security going to presents the annual risk report?","Are the new head of security going to present the annual risk report?","Is the new head of security going to present the annual risk report?","Does the new head of security going to present the annual risk report?"],"answer":2,"explanation":"Singular: Is. After going to: base verb present (not presents)."},{"question":"Which sentence is correct?","choices":["The logistics team is going to delivered the new equipment on Thursday.","The logistics team are going to deliver the new equipment on Thursday.","The logistics team is going to deliver the new equipment on Thursday.","The logistics team is going deliver to the new equipment on Thursday."],"answer":2,"explanation":"Singular: is. After going to: base verb deliver (not delivered). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["I am not going to attending the briefing tomorrow.","I am not going to attend the briefing tomorrow.","I is not going to attend the briefing tomorrow.","I am going to not attend the briefing tomorrow."],"answer":1,"explanation":"I \u2192 am. After going to: base verb attend (not attending). 'Not' before 'going to'."},{"question":"Which sentence is correct?","choices":["Are the security officers going to conducts a surprise inspection tomorrow?","Is the security officers going to conduct a surprise inspection tomorrow?","Are the security officers going to conduct a surprise inspection tomorrow?","Do the security officers going to conduct a surprise inspection tomorrow?"],"answer":2,"explanation":"Plural: Are. After going to: base verb conduct (not conducts)."},{"question":"Which sentence is correct?","choices":["The perimeter sensor is beeping \u2014 it is going to triggered an alert!","The perimeter sensor is beeping \u2014 it are going to trigger an alert!","The perimeter sensor is beeping \u2014 it is going triggered to an alert!","The perimeter sensor is beeping \u2014 it is going to trigger an alert!"],"answer":3,"explanation":"Singular: is. After going to: base verb trigger (not triggered). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["The officers are going to conduct a surprise inspection tomorrow to morning.","The officers are going to conduct a surprise inspection tomorrow morning.","The officers is going to conduct a surprise inspection tomorrow morning.","The officers are going to conducts a surprise inspection tomorrow morning."],"answer":1,"explanation":"'Tomorrow morning' needs no preposition. Plural: are. After going to: base verb conduct (not conducts)."}],"points":10,"explanation":"After going to: always BASE verb (no -s, no -ed). is/are confusion. Missing 'to'. 'Not' before 'going to'. Going to \u2260 gonna in formal writing."}]},{"id":"r1","name":"Why Security Careers Are Rising","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ","type":"reading","question":"Read the text carefully and answer each question.","textContent":"Why Security Careers Are Rising\n\nIn an age marked by rapid global shifts, digital transformation, and new geopolitical challenges, the security sector is undergoing a powerful evolution. From traditional law enforcement to cybersecurity, border control, and corporate protection, security jobs are no longer just about brute strength or surveillance - they're about intelligence, strategy, and adaptability. Governments and private companies alike are ramping up their security operations, and this trend shows no signs of slowing down.\n\nA key player in the European security infrastructure is the European Border and Coast Guard Agency - better known as Frontex. While most people associate Frontex with uniformed border guards, the organization also offers vital administrative roles. These Frontex vacancies provide a pathway into international service for professionals with backgrounds in HR, finance, law, policy, communications, and IT. Preparing for a Frontex interview requires a solid understanding of EU regulations, cross-border cooperation, and crisis management - but the rewards are substantial, including stability, career growth, and the prestige of working at the heart of European security.\n\nThe Expanding Landscape of Security Jobs\n\nSecurity today is multifaceted. From airport screening staff and cybersecurity analysts to risk assessment consultants and emergency preparedness coordinators, the opportunities stretch across nearly every industry and continent. Even sectors once considered unrelated to security - like healthcare, education, and logistics - now have critical safety and risk management roles to fill.\n\nWhy the surge? It comes down to three key factors:\n\n1. Increased Threat Awareness: Global incidents like cyberattacks, pandemics, terrorism, and political instability have forced organizations to rethink risk in all dimensions.\n\n2. Regulatory Pressure: Governments are tightening compliance requirements around data protection, workplace safety, and crisis response.\n\n3. Technology Integration: AI surveillance, biometric scanning, threat detection software - the tools are advancing, and so is the need for skilled people to manage them.","questions":[{"question":"1. Why are security careers evolving today?","choices":["A. They are becoming less useful","B. Because of global and technological changes","C. Because companies are closing","D. Thanks to international tourism"],"answer":1,"explanation":"The sector is evolving due to rapid global shifts and digital transformation."},{"question":"2. How are security jobs described?","choices":["A. Purely physical jobs","B. Jobs limited to the police","C. Jobs requiring intelligence and adaptability","D. Temporary jobs"],"answer":2,"explanation":"Security jobs now require intelligence, strategy, and adaptability."},{"question":"3. What does Frontex illustrate?","choices":["A. Only military can work there","B. Administrative roles play a key part in security","C. Jobs are reserved for students","D. Security only concerns borders"],"answer":1,"explanation":"Frontex also offers vital administrative roles."},{"question":"4. Which skills are important for a Frontex role?","choices":["A. Improvisation only","B. Physical fitness only","C. Regulatory knowledge and cross-border cooperation","D. Working alone permanently"],"answer":2,"explanation":"EU regulations, cross-border cooperation, and crisis management are mentioned."},{"question":"5. Which advantage of a Frontex career is mentioned?","choices":["A. Longer holidays","B. Professional stability and career growth","C. Reduced working hours","D. No responsibilities"],"answer":1,"explanation":"The text highlights stability, career growth, and prestige."},{"question":"6. What does multifaceted security mean?","choices":["A. Security covers several fields","B. Security is useless","C. Only states deal with security","D. Security depends only on technology"],"answer":0,"explanation":"Security now spans many industries and roles."},{"question":"7. Why do sectors like healthcare recruit in security?","choices":["A. To replace employees","B. Because safety and risk management are essential","C. To reduce costs","D. They are abandoning their main activities"],"answer":1,"explanation":"Healthcare, education, and logistics now have critical safety roles."},{"question":"8. What is the first key factor explaining the surge?","choices":["A. Decline in international trade","B. Disappearance of new technologies","C. Increased awareness of global risks","D. Fewer regulations"],"answer":2,"explanation":"Increased Threat Awareness is the first key factor."},{"question":"9. How do new technologies influence security?","choices":["A. They eliminate the need for staff","B. They create new needs for specialised skills","C. They make training unnecessary","D. They replace all cooperation"],"answer":1,"explanation":"Tools advance and so does the need for skilled people."},{"question":"10. What is the main idea of the text?","choices":["A. Security careers are in decline","B. Security is becoming a strategic and diverse field","C. Companies refuse to invest in security","D. Global risks have disappeared"],"answer":1,"explanation":"Security is growing in scope, importance, and diversity."}],"points":10},{"name":"Reading - True / False","type":"reading","question":"Read the text and decide: True or False?","textContent":"Why Security Careers Are Rising\n\nIn an age marked by rapid global shifts, digital transformation, and new geopolitical challenges, the security sector is undergoing a powerful evolution. From traditional law enforcement to cybersecurity, border control, and corporate protection, security jobs are no longer just about brute strength or surveillance - they're about intelligence, strategy, and adaptability. Governments and private companies alike are ramping up their security operations, and this trend shows no signs of slowing down.\n\nA key player in the European security infrastructure is the European Border and Coast Guard Agency - better known as Frontex. While most people associate Frontex with uniformed border guards, the organization also offers vital administrative roles. These Frontex vacancies provide a pathway into international service for professionals with backgrounds in HR, finance, law, policy, communications, and IT. Preparing for a Frontex interview requires a solid understanding of EU regulations, cross-border cooperation, and crisis management - but the rewards are substantial, including stability, career growth, and the prestige of working at the heart of European security.\n\nThe Expanding Landscape of Security Jobs\n\nSecurity today is multifaceted. From airport screening staff and cybersecurity analysts to risk assessment consultants and emergency preparedness coordinators, the opportunities stretch across nearly every industry and continent. Even sectors once considered unrelated to security - like healthcare, education, and logistics - now have critical safety and risk management roles to fill.\n\nWhy the surge? It comes down to three key factors:\n\n1. Increased Threat Awareness: Global incidents like cyberattacks, pandemics, terrorism, and political instability have forced organizations to rethink risk in all dimensions.\n\n2. Regulatory Pressure: Governments are tightening compliance requirements around data protection, workplace safety, and crisis response.\n\n3. Technology Integration: AI surveillance, biometric scanning, threat detection software - the tools are advancing, and so is the need for skilled people to manage them.","questions":[{"question":"1. Security jobs are only about physical surveillance.","choices":["True","False"],"answer":1,"explanation":"False - security is now about intelligence, strategy, and adaptability."},{"question":"2. Private companies also invest in security operations.","choices":["True","False"],"answer":0,"explanation":"True - governments and private companies alike are ramping up security."},{"question":"3. Frontex only employs uniformed border guards.","choices":["True","False"],"answer":1,"explanation":"False - Frontex also offers vital administrative roles."},{"question":"4. Knowledge of EU regulations is useful in the security sector.","choices":["True","False"],"answer":0,"explanation":"True - EU regulations are mentioned as important for Frontex roles."},{"question":"5. Security opportunities are limited to borders and airports.","choices":["True","False"],"answer":1,"explanation":"False - security spans nearly every industry and continent."},{"question":"6. The healthcare sector now has security-related needs.","choices":["True","False"],"answer":0,"explanation":"True - healthcare, education, and logistics are mentioned."},{"question":"7. Global threats have decreased according to the text.","choices":["True","False"],"answer":1,"explanation":"False - global incidents have forced organisations to rethink risk."},{"question":"8. AI surveillance is mentioned as a technological development.","choices":["True","False"],"answer":0,"explanation":"True - AI surveillance, biometric scanning, and threat detection are cited."},{"question":"9. Frontex careers are described as unstable and unattractive.","choices":["True","False"],"answer":1,"explanation":"False - the text highlights stability, career growth, and prestige."},{"question":"10. The demand for skilled staff grows alongside technology.","choices":["True","False"],"answer":0,"explanation":"True - as tools advance, so does the need for skilled people."}],"points":10}]},{"id":"v7","name":"Human Resources","category":"vocab","vocab":"recrutement = recruitment\nentretien d'embauche = job interview\ncontrat de travail = employment contract\nsalaire = salary\nheures supplementaires = overtime\nformation = training\npromotion = promotion\nevaluation des performances = performance appraisal\nlicenciement = dismissal\nperiode d'essai = probation period\ncandidate = candidat\nresume / CV = CV\ncover letter = lettre de motivation\nemployer = employeur\nemployee = employe\nbonus = prime\nfull-time = temps plein\npart-time = temps partiel\npaid leave = conges payes\nresignation = demission","exercises":[{"name":"Match - Human Resources (EN \u2192 FR)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"recruitment","right":"recrutement"},{"left":"job interview","right":"entretien d'embauche"},{"left":"employment contract","right":"contrat de travail"},{"left":"salary","right":"salaire"},{"left":"overtime","right":"heures supplementaires"},{"left":"training","right":"formation"},{"left":"promotion","right":"promotion"},{"left":"performance appraisal","right":"evaluation des performances"},{"left":"dismissal","right":"licenciement"},{"left":"probation period","right":"periode d'essai"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Human Resources (FR \u2192 EN)","type":"match","question":"Match each term to its equivalent.","leftLabel":"French","rightLabel":"English","pairs":[{"left":"candidat","right":"candidate"},{"left":"CV","right":"resume / CV"},{"left":"lettre de motivation","right":"cover letter"},{"left":"employeur","right":"employer"},{"left":"employe","right":"employee"},{"left":"prime","right":"bonus"},{"left":"temps plein","right":"full-time"},{"left":"temps partiel","right":"part-time"},{"left":"conges payes","right":"paid leave"},{"left":"demission","right":"resignation"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Human Resources (Word \u2192 Definition)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English term","rightLabel":"Definition","pairs":[{"left":"recruitment","right":"The process of finding and selecting suitable candidates for a job"},{"left":"probation period","right":"A trial period at the start of a job during which suitability is assessed"},{"left":"performance appraisal","right":"A regular review of an employee's work quality and results"},{"left":"dismissal","right":"The act of ending an employee's contract by the employer"},{"left":"overtime","right":"Hours worked beyond the standard working schedule, usually paid at a higher rate"},{"left":"employment contract","right":"A legal document that sets out the terms and conditions of employment"},{"left": ability."},{"question":"A ___ occurs when an employee is forced to leave by the employer.","choices":["resignation","retirement","dismissal","promotion"],"answer":2,"explanation":"Dismissal ends the employment relationship."},{"question":"A ___ is an upward move to a higher position.","choices":["training","skill","probation period","promotion"],"answer":3,"explanation":"A promotion means a higher-level position."},{"question":"The regular review of an employee's work is called a ___.","choices":["performance appraisal","job interview","vacancy","dismissal"],"answer":0,"explanation":"A performance appraisal evaluates work and results."}],"points":10,"explanation":"Review human resources vocabulary."}]},{"id":"v8","name":"Management","category":"vocab","vocab":"leadership = leadership\ndelegation = delegation\nproductivite = productivity\nresolution de problemes = problem solving\nnegociation = negotiation\nplanification = planning\nperformance = performance\namelioration continue = continuous improvement\nprise de decision = decision-making\ntravail d'equipe = teamwork\nmanager = manager\nteam leader = chef d'equipe\ngoal = objectif\nstrategy = strategie\nmeeting = reunion\nresponsibility = responsabilite\ncommunication = communication\nmotivation = motivation\nconflict = conflit\ncustomer satisfaction = satisfaction client","exercises":[{"name":"Match - Management (EN \u2192 FR)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"leadership","right":"leadership"},{"left":"delegation","right":"delegation"},{"left":"productivity","right":"productivite"},{"left":"problem solving","right":"resolution de problemes"},{"left":"negotiation","right":"negociation"},{"left":"planning","right":"planification"},{"left":"performance","right":"performance"},{"left":"continuous improvement","right":"amelioration continue"},{"left":"decision-making","right":"prise de decision"},{"left":"teamwork","right":"tra ary list."},{"name":"QCM - Management","type":"qcm_sequence","questions":[{"question":"The ability to guide and inspire a team is called ___.","choices":["delegation","conflict","leadership","productivity"],"answer":2,"explanation":"Leadership motivates and guides people."},{"question":"Assigning tasks and authority to team members is called ___.","choices":["negotiation","delegation","planning","decision-making"],"answer":1,"explanation":"Delegation gives responsibility to others."},{"question":"___ refers to the amount of work produced in a given time.","choices":["Quality","Productivity","Motivation","Communication"],"answer":1,"explanation":"Productivity measures work efficiency."},{"question":"Finding solutions to problems is called ___.","choices":["time management","customer satisfaction","problem solving","continuous improvement"],"answer":2,"explanation":"Problem solving identifies and resolves issues."},{"question":"___ involves reaching a mutually acceptable agreement.","choices":["Conflict","Collaboration","Negotiation","Leadership"],"answer":2,"explanation":"Negotiation reaches agreement through discussion."},{"question":"A ___ brings team members together to discuss projects.","choices":["meeting","goal","strategy","project"],"answer":0,"explanation":"A meeting discusses work matters."},{"question":"An ongoing effort to improve processes is called ___.","choices":["delegation","continuous improvement","time management","decision-making"],"answer":1,"explanation":"Continuous improvement seeks better ways of working."},{"question":"Setting goals and organising resources is ___.","choices":["conflict","planning","teamwork","performance"],"answer":1,"explanation":"Planning sets objectives and prepares actions."},{"question":"___ measures how well objectives are achieved.","choices":["Delegation","Motivation","Performance","Collaboration"],"answer":2,"explanation":"Performance measures how well objectives are met."},{"question":"A ___ is a disagreement betw  walking around an area to detect issues."},{"question":"Checking that a person is who they claim to be is an ___.","choices":["evacuation","ID check","incident report","alarm check"],"answer":1,"explanation":"An ID check verifies identity before granting access."},{"question":"Calming down an aggressive situation without using force is ___ the situation.","choices":["reporting","evacuating","de-escalating","patrolling"],"answer":2,"explanation":"De-escalation reduces tension."},{"question":"After an incident, the officer must ___ describing what happened.","choices":["patrol the site","call emergency services","write an incident report","guide visitors"],"answer":2,"explanation":"An incident report records what occurred."},{"question":"If a fire breaks out, security staff must ___ immediately.","choices":["prevent theft","provide first aid","evacuate the building","inspect equipment"],"answer":2,"explanation":"Evacuating moves everyone to safety."},{"question":"Watching CCTV footage to identify suspicious activity is called ___.","choices":["access control","surveillance","bag search","first aid"],"answer":1,"explanation":"Surveillance monitors areas via cameras."},{"question":"When spotting unusual behaviour, officers should ___ immediately.","choices":["manage conflicts","guide visitors","report suspicious activity","secure the site"],"answer":2,"explanation":"Reporting allows a rapid response."},{"question":"Ensuring only authorised people enter a site is ___.","choices":["access control","evacuation","patrol","first aid"],"answer":0,"explanation":"Access control restricts entry to authorised individuals."},{"question":"Treating injuries before medical professionals arrive is ___.","choices":["bag search","first aid","incident reporting","alarm check"],"answer":1,"explanation":"First aid is immediate care before professionals arrive."},{"question":"Creating a safe environment includes preventing theft, vandalism, and ___.","choices":["providing bonuses","managin ill be absent?","explanation":"WH + modal + subject + base verb + object + if + clause?"},{"words":["do","What","offer","for","the","company","development","does","professional","its","staff"],"answer":"What does the company offer for the professional development of its staff?","explanation":"WH + does + subject + base verb + for + object?"},{"words":["harassment","reported","should","to","be","Who","workplace"],"answer":"Who should workplace harassment be reported to?","explanation":"WH + modal + subject + be + past participle + to?"},{"words":["the","does","often","How","review","health","company","and","safety","its","policy"],"answer":"How often does the company review its health and safety policy?","explanation":"How often + does + subject + base verb + object?"},{"words":["like","the","What","working","conditions","in","are","security","sector"],"answer":"What are the working conditions like in the security sector?","explanation":"What + are + subject + like?"},{"words":["does","it","What","mean","on","a","to","be","probation","period"],"answer":"What does it mean to be on a probation period?","explanation":"What + does + it + mean + to + base verb?"},{"words":["apply","for","can","When","leave","parental","employees"],"answer":"When can employees apply for parental leave?","explanation":"WH + modal + subject + base verb + for + object?"},{"words":["the","company","benefits","does","What","offer","to","its","security","officers"],"answer":"What benefits does the company offer to its security officers?","explanation":"WH + does + subject + base verb + to + object?"},{"words":["shift","the","Who","assigns","zones","patrol","to","officers"],"answer":"Who assigns the patrol zones to officers?","explanation":"Who (as subject) + verb + object: no auxiliary needed."},{"words":["employees","are","entitled","many","leave","days","How","to","annual","of"],"answer":"How many days of annual leave are employees entitled to?","explanation":"How many + noun + of + noun + are + subject + past participle?"}],"points":10,"explanation":"WH + auxiliary + subject + base verb? Passive: WH + is/are + subject + past participle? Subject WH: Who/What + verb."},{"name":"WH Questions - Find the Error (1)","type":"error_sequence","sentences":[{"sentence":"What time the morning shift does start?","errorWord":"does","correction":"does the morning shift","explanation":"Correct order: What time + does + subject + base verb: What time does the morning shift start?"},{"sentence":"Who is responsible of health and safety in the workplace?","errorWord":"of","correction":"for","explanation":"Responsible FOR (not responsible of)."},{"sentence":"Why does the company has a strict dress code?","errorWord":"has","correction":"have","explanation":"After does: base verb -> have (not has)."},{"sentence":"How many shifts does the security team works each week?","errorWord":"works","correction":"work","explanation":"After does: base verb -> work (not works)."},{"sentence":"Where is the assembly point it located?","errorWord":"it","correction":"","explanation":"Remove 'it': Where is the assembly point located?"},{"sentence":"How long does a probation period usually lasts?","errorWord":"lasts","correction":"last","explanation":"After does: base verb -> last (not lasts)."},{"sentence":"What employees must do if they witness workplace harassment?","errorWord":"employees","correction":"must employees","explanation":"Correct order: What + must + subject + base verb."},{"sentence":"How often is performance appraisals carried out?","errorWord":"is","correction":"are","explanation":"Performance appraisals is plural -> How often ARE performance appraisals carried out?"},{"sentence":"Where should employees goes to report a workplace problem?","errorWord":"goes","correction":"go","explanation":"After should: base verb -> go (not goes)."},{"sentence":"What kind behaviour is considered harassment in the workplace?","errorWord":"kind","correction":"kind of","explanation":"What kind OF + noun: What kind of behaviour."},{"sentence":"Why do need employees to follow the code of conduct?","errorWord":"need","correction":"do employees need","explanation":"Correct order: Why + do + subject + base verb: Why do employees need?"},{"sentence":"Who does manages the overtime requests for the security team?","errorWord":"does","correction":"","explanation":"When Who is the subject, no auxiliary: Who manages? (not Who does manage)."}],"points":10,"explanation":"WH + auxiliary + subject + base verb? Subject WH: no auxiliary. After does/did/should/must: base verb. Responsible FOR."},{"name":"WH Questions - Find the Error (2)","type":"error_sequence","sentences":[{"sentence":"How long does it takes to process a leave request?","errorWord":"takes","correction":"take","explanation":"After does: base verb -> take (not takes)."},{"sentence":"What type of contract does most security officers have?","errorWord":"does","correction":"do","explanation":"Most security officers is plural -> do (not does)."},{"sentence":"How often the anti-discrimination policy is reviewed?","errorWord":"the","correction":"is the","explanation":"Correct order: How often + IS + subject + past participle."},{"sentence":"What does the company expects from its security officers?","errorWord":"expects","correction":"expect","explanation":"After does: base verb -> expect (not expects)."},{"sentence":"When should absence reported to the manager?","errorWord":"reported","correction":"be reported","explanation":"Passive question: should + BE + past participle: should be reported."},{"sentence":"How does the company calculate overtime pay to security officers?","errorWord":"to","correction":"for","explanation":"Calculate overtime pay FOR security officers (not 'to')."},{"sentence":"Where can employees raises a grievance?","errorWord":"raises","correction":"raise","explanation":"After can: base verb -> raise (not raises)."},{"sentence":"What the working conditions are like in the security sector?","errorWord":"conditions","correction":"are the working conditions","explanation":"Correct order: What + ARE + subject + like."},{"sentence":"How many days of annual leave is employees entitled to?","errorWord":"is","correction":"are","explanation":"Employees is plural -> How many days ARE employees entitled to?"},{"sentence":"Why is it important arrive on time for each shift?","errorWord":"arrive","correction":"to arrive","explanation":"It is important TO arrive (infinitive needed)."},{"sentence":"Who does sign the employment contract on behalf of the company?","errorWord":"does","correction":"","explanation":"When Who is the subject, no auxiliary: Who signs? (not Who does sign)."},{"sentence":"How long does it mean to be on a probation period?","errorWord":"long","correction":"does it mean","explanation":"Correct WH word: WHAT does it mean (not How long)."}],"points":10,"explanation":"WH + auxiliary + subject + base verb. Subject WH: no auxiliary. After does/can/should/must: base verb. Passive: be + past participle."},{"name":"WH Questions - Find the Error (3)","type":"error_sequence","sentences":[{"sentence":"What does it mean be on a probation period?","errorWord":"mean","correction":"mean to be","explanation":"Mean + TO + base verb: What does it mean TO BE on a probation period?"},{"sentence":"How many days of annual leave employees are entitled to?","errorWord":"employees","correction":"are employees","explanation":"Correct order: How many days + ARE + employees + past participle."},{"sentence":"Who should workplace harassment reported to?","errorWord":"reported","correction":"be reported","explanation":"Passive: should + BE + past participle: should be reported to."},{"sentence":"Where informations about workplace rules can employees find?","errorWord":"informations","correction":"information","explanation":"Information is uncountable - no plural -s."},{"sentence":"How often does the company reviews its health and safety policy?","errorWord":"reviews","correction":"review","explanation":"After does: base verb -> review (not reviews)."},{"sentence":"How is the overtime rate calculate for security officers?","errorWord":"calculate","correction":"calculated","explanation":"Passive: How is the overtime rate CALCULATED (past participle)?"},{"sentence":"Why is it important to arrives on time for each shift?","errorWord":"arrives","correction":"arrive","explanation":"After 'to': base verb -> to arrive (not to arrives)."},{"sentence":"What does it mean to be in a probation period?","errorWord":"in","correction":"on","explanation":"Correct expression: to be ON a probation period (not 'in')."},{"sentence":"How many days do employees needs to wait before requesting annual leave?","errorWord":"needs","correction":"need","explanation":"After do: base verb -> need (not needs)."},{"sentence":"When employees must notify their manager if they will be absent?","errorWord":"employees","correction":"must employees","explanation":"Correct order: When + must + subject + base verb: When must employees notify?"},{"sentence":"What benefits does the company offer it to its security officers?","errorWord":"it","correction":"","explanation":"Remove redundant 'it': What benefits does the company offer to its security officers?"},{"sentence":"Where can employees raise a grievance if they feel unfairly treated have been?","errorWord":"treated","correction":"have been treated","explanation":"Correct order of passive perfect: have been treated (not treated have been)."}],"points":10,"explanation":"Passive (be + past participle), base verb after auxiliary, uncountable nouns, subject-auxiliary inversion, correct prepositions."}]},{"id":"r2","name":"Who Should Consider a Career in Security?","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ (10Q)","type":"reading","question":"Read the text carefully and answer each question.","textContent":"Who Should Consider a Career in Security?\n\nSecurity roles aren't limited to those with military or law enforcement backgrounds. In fact, the modern security workforce is highly diverse, encompassing people from disciplines like:\n- Information technology (cybersecurity and data protection)\n- Psychology and social work (threat assessment and crisis counseling)\n- Public administration (emergency planning, diplomacy, policy analysis)\n- Engineering and infrastructure (physical site security, risk engineering)\n- Communications (strategic messaging during crises)\n\nIf you're someone who values mission-driven work, thrives under pressure, and wants to contribute to a safer world, a security career could be a perfect match.\n\nEntry Points: From Local Roles to International Agencies\n\nDepending on your goals, you can enter the field through multiple pathways:\n- Private Sector: Corporate security departments often recruit talent from business, law, and tech backgrounds to manage internal risk.\n- Government Agencies: Roles in homeland security, intelligence, customs, and defense offer training and long-term career ladders.\n- International Organizations: Agencies like the United Nations, NATO, and the European Union offer global security positions with far-reaching impact.\n\nRegardless of the entry point, what matters most is skill-building. Certifications such as CISSP (Certified Information Systems Security Professional), CTPAT (Customs-Trade Partnership Against Terrorism), or CPP (Certified Protection Professional) can boost credibility and earnings potential.\n\nThe Rise of Administrative Security Roles\n\nWhile frontline personnel are vital, the brains behind any security operation often sit in administrative and strategic positions. These roles ensure smooth coordination, funding, legal compliance, and effective communication. Think operations officers, budget analysts, legal advisors, recruitment coordinators, and digital strategists.\n\nAdministrative careers in security are especially attractive because they:\n- Offer long-term stability\n- Tend to be less physically demanding\n- Allow for upward mobility into leadership\n- Attract professionals from non-traditional backgrounds\n\nThis shift creates space for people who may not have a policing background but bring valuable administrative, analytical, or policy expertise.\n\nRemote and Tech-Based Security Jobs\n\nThe remote work boom has also impacted security careers. Many roles can now be done partially or fully online - particularly in threat analysis, cybersecurity, and compliance monitoring. Tech-savvy professionals can find opportunities to:\n- Monitor digital threats and vulnerabilities\n- Analyze intelligence from satellite feeds and sensors\n- Coordinate logistics and incident responses from afar\n- Train others via online platforms or virtual simulations\n\nAI and machine learning are further transforming security tasks. Predictive policing, facial recognition, and automated anomaly detection are just the beginning. The professionals of tomorrow will need to be agile, ethical, and constantly learning.","questions":[{"question":"1. What is the main idea the text develops about security careers?","choices":["A. They are reserved for military personnel","B. They concern a wide variety of profiles","C. They are progressively disappearing","D. They are exclusively physical"],"answer":1,"explanation":"The text states the modern security workforce is highly diverse, encompassing people from many disciplines."},{"question":"2. According to the text, what type of person may be attracted to a security career?","choices":["A. People looking for work without responsibilities","B. People motivated by work that is useful to society","C. People who refuse teamwork","D. People wanting to avoid all pressure"],"answer":1,"explanation":"The text mentions those who 'value mission-driven work, thrive under pressure, and want to contribute to a safer world'."},{"question":"3. What does the diversity of disciplines mentioned in the text show?","choices":["A. Security depends only on technology","B. Security requires multiple skills","C. Administrative roles are useless","D. Human skills are no longer needed"],"answer":1,"explanation":"The wide range of disciplines \u2014 IT, psychology, engineering, communications \u2014 shows security requires multiple skills."},{"question":"4. What seems essential to succeed in the security sector?","choices":["A. Luck","B. Family connections","C. Skill-building","D. Physical strength only"],"answer":2,"explanation":"The text states 'what matters most is skill-building'."},{"question":"5. Why are certifications mentioned in the text?","choices":["A. Because they replace experience","B. Because they can improve career prospects","C. Because they are compulsory in all roles","D. Because they reduce training time"],"answer":1,"explanation":"The text says certifications 'can boost credibility and earnings potential'."},{"question":"6. How are administrative roles presented in the text?","choices":["A. As secondary and of little use","B. As essential to the smooth running of operations","C. As reserved for beginners","D. As temporary positions"],"answer":1,"explanation":"The text says these roles 'ensure smooth coordination, funding, legal compliance, and effective communication'."},{"question":"7. Why do administrative security careers attract certain people?","choices":["A. Because they require few skills","B. Because they offer stability and career progression","C. Because they avoid teamwork entirely","D. Because they are only accessible remotely"],"answer":1,"explanation":"The text lists stability, less physical demand, upward mobility, and attracting non-traditional backgrounds."},{"question":"8. What recent change is influencing security careers?","choices":["A. The disappearance of digital technologies","B. The development of remote working","C. The reduction in cybersecurity needs","D. The closure of international organisations"],"answer":1,"explanation":"The text states 'the remote work boom has also impacted security careers'."},{"question":"9. What must tomorrow's security professionals develop?","choices":["A. A complete dependence on machines","B. A rigid and repetitive attitude","C. Adaptability and continuous learning","D. A single specialisation with no evolution"],"answer":2,"explanation":"The text says professionals 'will need to be agile, ethical, and constantly learning'."},{"question":"10. What general vision of security careers does the text present?","choices":["A. A closed and limited field","B. A modern sector undergoing major transformation","C. A sector reserved for the military","D. A field with no professional future"],"answer":1,"explanation":"The text presents security as a diverse, growing, and technologically evolving field."}],"points":10},{"name":"Reading - True / False","type":"reading","question":"Read the text and decide: True or False?","textContent":"Who Should Consider a Career in Security?\n\nSecurity roles aren't limited to those with military or law enforcement backgrounds. In fact, the modern security workforce is highly diverse, encompassing people from disciplines like:\n- Information technology (cybersecurity and data protection)\n- Psychology and social work (threat assessment and crisis counseling)\n- Public administration (emergency planning, diplomacy, policy analysis)\n- Engineering and infrastructure (physical site security, risk engineering)\n- Communications (strategic messaging during crises)\n\nIf you're someone who values mission-driven work, thrives under pressure, and wants to contribute to a safer world, a security career could be a perfect match.\n\nEntry Points: From Local Roles to International Agencies\n\nDepending on your goals, you can enter the field through multiple pathways:\n- Private Sector: Corporate security departments often recruit talent from business, law, and tech backgrounds to manage internal risk.\n- Government Agencies: Roles in homeland security, intelligence, customs, and defense offer training and long-term career ladders.\n- International Organizations: Agencies like the United Nations, NATO, and the European Union offer global security positions with far-reaching impact.\n\nRegardless of the entry point, what matters most is skill-building. Certifications such as CISSP (Certified Information Systems Security Professional), CTPAT (Customs-Trade Partnership Against Terrorism), or CPP (Certified Protection Professional) can boost credibility and earnings potential.\n\nThe Rise of Administrative Security Roles\n\nWhile frontline personnel are vital, the brains behind any security operation often sit in administrative and strategic positions. These roles ensure smooth coordination, funding, legal compliance, and effective communication. Think operations officers, budget analysts, legal advisors, recruitment coordinators, and digital strategists.\n\nAdministrative careers in security are especially attractive because they:\n- Offer long-term stability\n- Tend to be less physically demanding\n- Allow for upward mobility into leadership\n- Attract professionals from non-traditional backgrounds\n\nThis shift creates space for people who may not have a policing background but bring valuable administrative, analytical, or policy expertise.\n\nRemote and Tech-Based Security Jobs\n\nThe remote work boom has also impacted security careers. Many roles can now be done partially or fully online - particularly in threat analysis, cybersecurity, and compliance monitoring. Tech-savvy professionals can find opportunities to:\n- Monitor digital threats and vulnerabilities\n- Analyze intelligence from satellite feeds and sensors\n- Coordinate logistics and incident responses from afar\n- Train others via online platforms or virtual simulations\n\nAI and machine learning are further transforming security tasks. Predictive policing, facial recognition, and automated anomaly detection are just the beginning. The professionals of tomorrow will need to be agile, ethical, and constantly learning.","questions":[{"question":"1. The text states that only former military personnel can work in security.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text says security roles 'aren't limited to those with military or law enforcement backgrounds'."},{"question":"2. Communication skills can be useful in security careers.","choices":["True","False"],"answer":0,"explanation":"True \u2014 communications (strategic messaging during crises) is listed as one of the relevant disciplines."},{"question":"3. International organisations also offer careers in security.","choices":["True","False"],"answer":0,"explanation":"True \u2014 the UN, NATO, and the EU are mentioned as offering global security positions."},{"question":"4. The text emphasises the importance of skill-building.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'what matters most is skill-building' is stated clearly in the text."},{"question":"5. Administrative roles are described as useless in security operations.","choices":["True","False"],"answer":1,"explanation":"False \u2014 they are described as essential for coordination, funding, compliance, and communication."},{"question":"6. Administrative security careers are described as physically demanding.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text says they 'tend to be less physically demanding'."},{"question":"7. Remote working now influences some security careers.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'the remote work boom has also impacted security careers'."},{"question":"8. New technologies are gradually transforming the security sector.","choices":["True","False"],"answer":0,"explanation":"True \u2014 AI, machine learning, facial recognition, and predictive policing are all mentioned."},{"question":"9. The text suggests that professionals will need to keep learning.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'constantly learning' is explicitly mentioned."},{"question":"10. The text presents security careers as a declining field.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text presents security as a growing and transforming sector."}],"points":10}]},{"id":"r4","name":"Site Security - Invitation to Tender","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ (15Q)","type":"reading","question":"Read the document carefully and answer each question.","textContent":"NOTICE OF CONTRACTING OPPORTUNITY - SITE SECURITY - INVITATION TO TENDER\n\nTuesday, January 3, 2023\n\nSolicitation No. 476721-0068\nRegional Procurement Strategy for Indigenous Businesses\n\nParsons, as the Main Construction Manager (MCM) for the Giant Mine Remediation Project (GMRP) and acting as both the Mine Manager and Prime Contractor, will be soliciting a tender for the Site Security for the Giant Mine, Yellowknife, Northwest Territories. This Invitation to Tender is set up as a Regional Procurement Strategy for Indigenous Businesses (PSIB).\n\n(Regional PSIB refers to the initial evaluation of a minimum of two bids whereby the PSIB eligible Bidder's head office is from the Area of the Contract - if no compliant bid can be found from initial evaluation, evaluation of all other PSIB bids continues.)\n\nThe bids must be from PSIB eligible companies.\n\nThis Regional PSIB ITT will include, but is not limited to, the following:\n\n- Provide diligent protection of the Site and assets and restrict public access to the mine Site in accordance with referenced acts, standards, practices, and regulations, and Authorities Having Jurisdiction, using security measures, including but not limited to, security personnel conducting regular patrols to monitor Site for trespassing, vandalism, and theft for 24 hours/day, 365 days/year.\n\n- The work of this contract will require the subcontractor to provide all mobile equipment, including certain pieces of equipment that must be on Site on a full-time basis. Backup equipment does not need to be on the Site on a full-time basis but must be readily available when required.\n\n- Maintain records of activities, record sightings of wildlife on Site, monitor and keep a log of employees working alone as per pre-arranged communication procedures, receive and unload small deliveries by hand at Site gate and notify the Parsons Site Supervisor or office staff of their arrival; these would be limited to mail, courier packages, and similar mailable parcels.\n\n- Subcontractor will provide traffic control professionals to aid in traffic control for the entire site.\n- Subcontractor will procure and implement radio frequency identification program.\n- Subcontractor will provide transportation services between Yellowknife and Giant Mine.\n\nA mandatory pre-bid and site tour meeting will take place January 9, 2023. Work is anticipated to start Spring 2023.\n\nParsons is committed to ensuring procurement is conducted in a fair, open and transparent manner while meeting Comprehensive Land Claims Agreement (CLCA) commitments and the Government of Canada's procurement objectives regarding Indigenous opportunities. Competitive proposals will be solicited using the MERX Canadian Public Tenders website to select the best value firm to deliver the product to the Giant Mine in Yellowknife, Northwest Territories.\n\nAbridged from: https://giantminerp.ca/notice-contracting-opportunity-site-security-invitation-tender","questions":[{"question":"1. What is the main purpose of this document?","choices":["A. To build new buildings","B. To secure and monitor a site","C. To organise tourist visits","D. To train new employees"],"answer":1,"explanation":"The document is an Invitation to Tender for site security services at Giant Mine."},{"question":"2. What type of company is specifically targeted by this tender?","choices":["A. International companies","B. Tourism companies","C. Indigenous businesses from the region","D. Airlines"],"answer":2,"explanation":"The tender is set up as a Regional Procurement Strategy for Indigenous Businesses (PSIB)."},{"question":"3. What is one of the main missions of the subcontractor?","choices":["A. Sell industrial equipment","B. Prevent unauthorised access to the site","C. Repair administrative buildings","D. Organise public events"],"answer":1,"explanation":"The contract requires protection of the site and restricting public access."},{"question":"4. How must site security be provided?","choices":["A. Only during the day","B. Only during construction periods","C. Continuously throughout the year","D. Only at weekends"],"answer":2,"explanation":"The text specifies '24 hours/day, 365 days/year'."},{"question":"5. Why do security officers conduct patrols?","choices":["A. To welcome visitors","B. To check employee working hours","C. To prevent trespassing and vandalism","D. To guide tourists"],"answer":2,"explanation":"Patrols are conducted 'to monitor Site for trespassing, vandalism, and theft'."},{"question":"6. What must the subcontractor provide to carry out its missions?","choices":["A. Housing for employees","B. Mobile equipment","C. Agricultural tools","D. Medical equipment"],"answer":1,"explanation":"The contract requires the subcontractor to provide all mobile equipment."},{"question":"7. What quality is expected from backup equipment?","choices":["A. It must be decorative","B. It must be readily available when needed","C. It must be used every day","D. It must be provided by visitors"],"answer":1,"explanation":"The text states backup equipment 'must be readily available when required'."},{"question":"8. In addition to security, what administrative task is mentioned?","choices":["A. Organising university training","B. Managing records and logs","C. Preparing meals for employees","D. Creating advertising campaigns"],"answer":1,"explanation":"The contract includes maintaining records of activities and keeping logs."},{"question":"9. What shows that the site is located in a natural environment?","choices":["A. Recording wildlife sightings on site","B. The presence of shopping centres","C. The organisation of concerts","D. Employee sports activities"],"answer":0,"explanation":"The contract requires recording 'sightings of wildlife on Site'."},{"question":"10. What employee-related responsibility is mentioned in the text?","choices":["A. Monitoring their holidays","B. Monitoring those who work alone","C. Organising their leisure time","D. Distributing their salaries"],"answer":1,"explanation":"The contract requires keeping 'a log of employees working alone'."},{"question":"11. What logistical activity must the subcontractor also provide?","choices":["A. Transportation between two locations","B. International goods delivery","C. Road construction","D. Management of a seaport"],"answer":0,"explanation":"The text states 'transportation services between Yellowknife and Giant Mine'."},{"question":"12. What other area of expertise is required from the subcontractor?","choices":["A. Collective catering","B. Traffic control","C. Language teaching","D. Hotel management"],"answer":1,"explanation":"The contract requires 'traffic control professionals to aid in traffic control for the entire site'."},{"question":"13. What value is highlighted in the company selection process?","choices":["A. Speed only","B. Secrecy of procedures","C. Fairness and transparency","D. Competition among employees"],"answer":2,"explanation":"Parsons states procurement is 'conducted in a fair, open and transparent manner'."},{"question":"14. Why are competitive proposals invited?","choices":["A. To select the company offering the best value","B. To reduce the number of workers","C. To replace the original project","D. To limit site security"],"answer":0,"explanation":"Competitive proposals are solicited 'to select the best value firm'."},{"question":"15. What general picture of the project does the text give?","choices":["A. A temporary project with ency adverbs (always, usually, often, sometimes, rarely, never) -> BEFORE the main verb: She always checks the log.","Frequency adverbs with 'be' -> AFTER 'be': The manager is always available.","Manner adverbs (carefully, quickly) -> AFTER the verb or object: He writes the report carefully.","Time adverbs (every day, yesterday) -> usually at the END: The team meets every Monday.","Negative: Subject + don't/doesn't + base verb: The guards don't use phones on patrol."],"signals":["always, usually, often, sometimes, rarely, never, carefully, quickly, efficiently"]},"Question Formation":{"use":["Yes/No with BE: Is/Are + subject + rest?","Yes/No with other verbs: Do/Does + subject + base verb?","WH questions: WH word + auxiliary + subject + base verb?","Subject questions (who/what as subject): Who manages the security operations? (no auxiliary)","Embedded questions: normal word order after Do you know / Can you tell me: Do you know where the exit is?"],"form":["BE: Is the manager available? / Are the guards trained?","DO: Does she carry a radio? / Do they follow the procedure?","WH: Where does the night shift start? / How often do they train?","Subject WH: Who manages this sector? / What causes the alarm?","Embedded: Do you know where the report is? / Can you tell me when the shift starts?"],"signals":["is/are, do/does, who, what, where, when, why, how, how often, how long, how many"]},"Present Perfect":{"use":["Recent actions with a present result: The manager has just signed the report.","Experience (ever/never): Have you ever attended a crisis drill?","Unfinished time periods: The team has identified three threats this month.","Duration with for/since: She has worked here for five years / since 2019."],"form":["(+) has / have + past participle: The director has approved the plan.","(-) hasn't / haven't + past participle: We haven't received the update yet.","(?) Has / Have + subject + past participle?: Has the team completed the drill?"],"signals":["just, already, yet, ever, never, recently, so far, for, since, this week/month/year"],"key_pp":["go->gone | take->taken | write->written | catch->caught | find->found | see->seen | send->sent | be->been | have->had | do->done"]},"Future with WILL":{"use":["Spontaneous decisions: I'll deal with the report now.","Promises and offers: Don't worry, I'll help you with the briefing.","Predictions based on opinion (I think/believe/I'm sure): I think the new system will improve response times.","Conditional results (if...): If the alarm triggers, the officer will call backup.","Warnings: We will not tolerate any breach of protocol."],"form":["(+) will + base verb: The director will announce the new policy tomorrow.","(-) won't + base verb: The company won't renew the contract.","(?) Will + subject + base verb?: Will the team receive new equipment?"],"signals":["tomorrow, next week, probably, I think, I believe, I'm sure, if..."]},"Future with GOING TO":{"use":["Plans and decisions already made: We are going to recruit ten new officers - the contracts are ready.","Predictions based on present visible evidence: Watch out! The suspect is going to run - he's already moving!"],"form":["(+) am / is / are + going to + base verb: The team is going to implement the new system.","(-) am not / isn't / aren't + going to + base verb: She isn't going to renew her contract.","(?) Is / Are + subject + going to + base verb?: Are they going to complete the training?"],"signals":["next week/month, soon, tonight, Look!, Watch out!, already decided, planned"]}};
