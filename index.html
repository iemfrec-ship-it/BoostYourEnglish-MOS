const GRAMMAR_REF={"Present Simple":{"use":["Routine actions and habits: She checks the badges every morning.","General truths: The alarm rings when a badge is missing.","Schedules: The shift starts at 6 am."],"form":["(+) Subject + base verb (add -s for he/she/it): He patrols / They patrol","(-) don't / doesn't + base verb: She doesn't carry a weapon.","(?) Do / Does + subject + base verb?: Does he carry a radio?"],"signals":["every day/week, always, usually, often, sometimes, rarely, never"]},"Present Continuous (be+ing)":{"use":["Actions happening right now: She is monitoring the cameras.","Temporary situations: He is working the night shift this week.","Future arrangements already planned: We are meeting the director tomorrow."],"form":["(+) am / is / are + verb-ing: The officer is patrolling zone B.","(-) am not / isn't / aren't + verb-ing: They aren't responding.","(?) Is / Are + subject + verb-ing?: Is she checking the IDs?"],"signals":["now, right now, at the moment, currently, this week/month"],"spelling":["work -> working | patrol -> patrolling (double l) | run -> running (double n) | write -> writing (drop e) | try -> trying"]},"Past Simple (Preterit)":{"use":["Completed actions at a specific past time: The officer spotted the intruder at midnight.","Sequence of past events: He arrived, checked the badge and called the supervisor."],"form":["(+) Regular verbs: base verb + -ed: check -> checked, patrol -> patrolled","(+) Irregular verbs: go->went | take->took | write->wrote | catch->caught | find->found | see->saw | wear->wore | send->sent","(-) didn't + base verb: She didn't notice the package.","(?) Did + subject + base verb?: Did they report the incident?"],"signals":["yesterday, last week/month/year, ago, in 2022, at midnight, when..."]},"Sentence Construction":{"use":["Standard English word order: Subject + Verb + Object + Adverb of manner + Place + Time","Example: The officer carefully checks the badges at the entrance every morning."],"form":["Frequency adverbs (always, usually, often, sometimes, rarely, never) -> BEFORE the main verb: She always checks the log.","Frequency adverbs with 'be' -> AFTER 'be': The manager is always available.","Manner adverbs (carefully, quickly) -> AFTER the verb or object: He writes the report carefully.","Time adverbs (every day, yesterday) -> usually at the END: The team meets every Monday.","Negative: Subject + don't/doesn't + base verb: The guards don't use phones on patrol."],"signals":["always, usually, often, sometimes, rarely, never, carefully, quickly, efficiently"]},"Question Formation":{"use":["Yes/No with BE: Is/Are + subject + rest?","Yes/No with other verbs: Do/Does + subject + base verb?","WH questions: WH word + auxiliary + subject + base verb?","Subject questions (who/what as subject): Who manages the security operations? (no auxiliary)","Embedded questions: normal word order after Do you know / Can you tell me: Do you know where the exit is?"],"form":["BE: Is the manager available? / Are the guards trained?","DO: Does she carry a radio? / Do they follow the procedure?","WH: Where does the night shift start? / How often do they train?","Subject WH: Who manages this sector? / What causes the alarm?","Embedded: Do you know where the report is? / Can you tell me when the shift starts?"],"signals":["is/are, do/does, who, what, where, when, why, how, how often, how long, how many"]},"Present Perfect":{"use":["Recent actions with a present result: The manager has just signed the report.","Experience (ever/never): Have you ever attended a crisis drill?","Unfinished time periods: The team has identified three threats this month.","Duration with for/since: She has worked here for five years / since 2019."],"form":["(+) has / have + past participle: The director has approved the plan.","(-) hasn't / haven't + past participle: We haven't received the update yet.","(?) Has / Have + subject + past participle?: Has the team completed the drill?"],"signals":["just, already, yet, ever, never, recently, so far, for, since, this week/month/year"],"key_pp":["go->gone | take->taken | write->written | catch->caught | find->found | see->seen | send->sent | be->been | have->had | do->done"]},"Future with WILL":{"use":["Spontaneous decisions: I'll deal with the report now.","Promises and offers: Don't worry, I'll help you with the briefing.","Predictions based on opinion (I think/believe/I'm sure): I think the new system will improve response times.","Conditional results (if...): If the alarm triggers, the officer will call backup.","Warnings: We will not tolerate any breach of protocol."],"form":["(+) will + base verb: The director will announce the new policy tomorrow.","(-) won't + base verb: The company won't renew the contract.","(?) Will + subject + base verb?: Will the team receive new equipment?"],"signals":["tomorrow, next week, probably, I think, I believe, I'm sure, if..."]},"Future with GOING TO":{"use":["Plans and decisions already made: We are going to recruit ten new officers - the contracts are ready.","Predictions based on present visible evidence: Watch out! The suspect is going to run - he's already moving!"],"form":["(+) am / is / are + going to + base verb: The team is going to implement the new system.","(-) am not / isn't / aren't + going to + base verb: She isn't going to renew her contract.","(?) Is / Are + subject + going to + base verb?: Are they going to complete the training?"],"signals":["next week/month, soon, tonight, Look!, Watch out!, already decided, planned"]}};

function renderReorderSeq(p,ex){

    row.append(h('button',{cls:'btn btn-primary',disabled:!chosen.length,'@click':chk},'Check'));
    row.append(h('button',{cls:'btn btn-ghost btn-sm','@click':()=>{E._chosen=[];E._words=[...s.words].sort(()=>Math.random()-.5);render();}},'Reset'));

  } else {
    const ok=E.sc===10;
    const fb=h('div',{cls:'feedback '+(ok?'fb-ok':'fb-ko'),css:{marginTop:'10px'}},ok?'✓ Correct!':'✗ Not quite.');
    if(!ok)fb.append(h('div',{cls:'fb-exp'},'Correct sentence: '+s.answer));
    if(s.explanation)fb.append(h('div',{cls:'fb-exp',css:{marginTop:'4px'}},s.explanation));

    p.append(h('button',{cls:'btn btn-primary',css:{marginTop:'12px'},'@click':()=>{

      else{const avg=Math.round(ns.reduce((a,b)=>a+b,0)/ns.length);resetE();onDone(avg);}
    }},idx+1<sents.length?'Next →':'Finish ✓'));
  }
}
