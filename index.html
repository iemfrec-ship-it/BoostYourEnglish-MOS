<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Boost Your English — MOS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#e8e8e8;--bg1:#d8d8d8;--bg2:#cecece;--bg3:#c2c2c2;--bg4:#f2f2f2;
  --border:#b0b0b0;--border2:#a0a0a0;
  --text1:#111;--text2:#333;--text3:#666;
  --accent:#1a5fa8;--accent2:#144d8a;--accent3:#0e3d6e;
  --gold:#9a6e00;--gold2:#7c5800;
  --green:#1a6e3a;--green2:#145530;
  --red:#a82020;--red2:#881818;
  --vocab:#0e7272;--grammar:#6b3eac;--reading:#b84800;
  --radius:10px;--radius2:16px;
  --shadow:0 4px 20px rgba(0,0,0,.12);--shadow2:0 8px 36px rgba(0,0,0,.18);
}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text1);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;font-family:'Outfit',sans-serif;border:none;outline:none;transition:all .18s}
input,textarea,select{font-family:'Outfit',sans-serif;background:var(--bg3);border:1px solid var(--border);color:var(--text1);border-radius:var(--radius);padding:.6rem 1rem;font-size:.95rem;outline:none;transition:border .18s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--text3)}
textarea{resize:vertical}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg1)}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
select{width:100%;padding:.62rem 1rem}

/* HOME */
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.home-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(0,0,0,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.055) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.home-glow{position:absolute;inset:0;background:radial-gradient(ellipse 700px 400px at 50% 35%,rgba(26,95,168,.08),transparent 70%);pointer-events:none}
.flags-row{display:flex;gap:14px;margin-bottom:28px;animation:fadeDown .6s ease both;position:relative}
.flag{width:54px;height:36px;border-radius:6px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.2)}
.flag svg{width:100%;height:100%}
.home-title{font-family:'Space Grotesk',sans-serif;font-size:2.8rem;font-weight:700;text-align:center;line-height:1.15;animation:fadeUp .6s .1s ease both;position:relative}
.home-title .boost{color:var(--accent)}
.home-title .mos-badge{display:inline-block;background:var(--accent);color:#fff;font-size:1rem;padding:3px 14px;border-radius:20px;vertical-align:middle;margin-left:10px;font-weight:600;letter-spacing:.5px}
.home-sub{color:var(--text3);font-size:.9rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:10px;animation:fadeUp .6s .18s ease both;position:relative}
.home-cards{display:flex;gap:16px;margin-top:44px;animation:fadeUp .6s .26s ease both;position:relative}
@media(max-width:580px){.home-cards{flex-direction:column;width:100%;padding:0 20px}.home-title{font-size:2rem}}
.home-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);padding:26px 32px;text-align:center;cursor:pointer;transition:all .22s;flex:1;min-width:160px}
.home-card:hover{border-color:var(--accent);background:var(--bg2);transform:translateY(-3px);box-shadow:var(--shadow)}
.home-card .ci{font-size:2.2rem;margin-bottom:10px}
.home-card h3{font-size:1.05rem;margin-bottom:5px}
.home-card p{color:var(--text3);font-size:.82rem}
.home-footer{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-top:1px solid var(--border);background:var(--bg1)}
.home-credit{color:var(--text3);font-size:.78rem}
.btn-rgpd{background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:20px;padding:5px 16px;font-size:.78rem;cursor:pointer;transition:all .18s}
.btn-rgpd:hover{border-color:var(--accent);color:var(--accent)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fadeIn .2s ease}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);padding:34px;width:100%;max-width:460px;box-shadow:var(--shadow2);animation:slideUp .25s ease;max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:6px}.modal p{color:var(--text3);font-size:.88rem;margin-bottom:18px}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}

/* BUTTONS */
.btn{padding:.58rem 1.3rem;border-radius:var(--radius);font-size:.88rem;font-weight:500}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green2)}
.btn-danger{color:var(--red);background:transparent;border:1px solid rgba(168,32,32,.28)}.btn-danger:hover{background:rgba(168,32,32,.09)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.95rem;padding:0;border:none}
.btn-trash{color:var(--red);background:rgba(168,32,32,.08)}.btn-trash:hover{background:rgba(168,32,32,.18)}
.btn-edit{color:var(--accent);background:rgba(26,95,168,.08)}.btn-edit:hover{background:rgba(26,95,168,.18)}

/* TOPBAR */
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
.app-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1.08rem;color:var(--accent)}
.xp-pill{display:flex;align-items:center;gap:7px;background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);border-radius:20px;padding:5px 13px;font-size:.85rem;font-weight:600;color:var(--gold)}

/* LAYOUT */
.page-wrap{flex:1;padding:22px;max-width:820px;margin:0 auto;width:100%}
.page-title{font-size:1.45rem;margin-bottom:4px}
.page-sub{color:var(--text3);font-size:.88rem;margin-bottom:22px}

/* CAT TABS */
.cat-tabs{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.cat-tab{padding:8px 18px;border-radius:20px;font-size:.85rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg2);transition:all .18s}
.cat-tab:hover{border-color:var(--accent)}
.cat-tab.all-act{background:rgba(26,95,168,.1);border-color:var(--accent);color:var(--accent)}
.cat-tab.vocab-act{background:rgba(14,114,114,.12);border-color:var(--vocab);color:var(--vocab)}
.cat-tab.grammar-act{background:rgba(107,62,172,.12);border-color:var(--grammar);color:var(--grammar)}
.cat-tab.reading-act{background:rgba(184,72,0,.12);border-color:var(--reading);color:var(--reading)}

/* THEME CARDS */
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px}
.theme-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);padding:18px;cursor:pointer;transition:all .22s;position:relative;overflow:hidden}
.theme-card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.theme-card.vocab:hover{border-color:var(--vocab)}
.theme-card.grammar:hover{border-color:var(--grammar)}
.theme-card.reading:hover{border-color:var(--reading)}
.tc-icon{font-size:1.6rem;margin-bottom:8px}
.tc-name{font-size:.95rem;font-weight:600;margin-bottom:3px}
.tc-count{color:var(--text3);font-size:.78rem}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:10px;overflow:hidden}
.prog-fill-vocab{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--vocab),#1aa0a0);transition:width .4s}
.prog-fill-grammar{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--grammar),#8b5cf6);transition:width .4s}
.prog-fill-reading{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--reading),#e07000);transition:width .4s}
.prog-label{font-size:.73rem;color:var(--text3);margin-top:4px}

/* TYPE BADGES */
.type-badge{padding:3px 10px;border-radius:20px;font-size:.73rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tb-qcm{background:rgba(26,95,168,.12);color:var(--accent)}
.tb-match{background:rgba(14,114,114,.12);color:var(--vocab)}
.tb-fill{background:rgba(107,62,172,.12);color:var(--grammar)}
.tb-error{background:rgba(168,32,32,.12);color:var(--red)}
.tb-reading{background:rgba(184,72,0,.12);color:var(--reading)}

/* EXERCISE */
.ex-box{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);padding:26px;margin-bottom:18px}
.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ex-q{font-size:1.1rem;margin-bottom:18px;line-height:1.65}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:12px 15px;cursor:pointer;text-align:left;font-size:.93rem;color:var(--text1);width:100%;transition:all .18s}
.choice:hover:not(:disabled){background:var(--bg3);border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:rgba(26,95,168,.09)}
.choice.ok{border-color:var(--green);background:rgba(26,110,58,.09);color:var(--green)}
.choice.ko{border-color:var(--red);background:rgba(168,32,32,.09);color:var(--red)}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.match-col-title{font-size:.78rem;color:var(--text3);margin-bottom:5px;font-weight:600}
.match-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 13px;cursor:pointer;font-size:.88rem;transition:all .18s;min-height:42px;display:flex;align-items:center}
.match-item:hover{border-color:var(--accent)}
.mi-sel{border-color:var(--gold)!important;background:rgba(154,110,0,.09);color:var(--gold)}
.mi-ok{border-color:var(--green)!important;background:rgba(26,110,58,.09);color:var(--green);pointer-events:none}
.mi-ko{border-color:var(--red)!important;background:rgba(168,32,32,.09);color:var(--red);animation:shake .3s ease}
.blank-inp{border:none;border-bottom:2px solid var(--accent);background:transparent;width:160px;text-align:center;font-size:.95rem;padding:.32rem .4rem;margin:0 4px;color:var(--text1);outline:none}
.fill-sent{font-size:1.05rem;line-height:2.5;margin-bottom:18px}
.error-sent{font-size:1.05rem;line-height:1.9;margin-bottom:16px;background:var(--bg2);padding:14px 18px;border-radius:var(--radius);border:1px solid var(--border)}
.error-word{cursor:pointer;padding:2px 5px;border-radius:4px;transition:all .18s;border:1px solid transparent}
.error-word:hover{background:rgba(168,32,32,.09);border-color:rgba(168,32,32,.3)}
.error-word.ew-sel{background:rgba(168,32,32,.14);color:var(--red);font-weight:600;border-color:var(--red)}
.error-word.ew-ok{background:rgba(26,110,58,.12);color:var(--green);font-weight:600;border-color:var(--green)}
.error-word.ew-ko{background:rgba(168,32,32,.12);color:var(--red);border-color:var(--red)}
.feedback{border-left:4px solid;border-radius:var(--radius);padding:13px 16px;margin-top:14px;font-size:.88rem;line-height:1.7;background:var(--bg2)}
.fb-ok{border-color:var(--green);color:var(--green)}.fb-ko{border-color:var(--red);color:var(--text1)}
.fb-exp{color:var(--text2);margin-top:6px}
.score-box{text-align:center;padding:22px;background:var(--bg2);border-radius:var(--radius2)}
.score-big{font-size:2.8rem;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--gold)}
.score-sub{color:var(--text3);margin-top:4px;font-size:.9rem}
.seq-progress{height:5px;background:var(--bg3);border-radius:3px;margin-bottom:18px;overflow:hidden}
.seq-bar-vocab{height:100%;border-radius:3px;background:var(--vocab);transition:width .3s}
.seq-bar-grammar{height:100%;border-radius:3px;background:var(--grammar);transition:width .3s}
.seq-bar-error{height:100%;border-radius:3px;background:var(--red);transition:width .3s}

/* PDF READER */
.pdf-reader{width:100%;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:18px}
.pdf-embed{width:100%;height:480px;border:none}
.pdf-fallback{padding:20px;text-align:center;color:var(--text3);background:#fff}

/* RESULTS PAGE */
.results-page{min-height:100vh;display:flex;flex-direction:column}
.res-header{background:var(--bg1);border-bottom:1px solid var(--border);padding:13px 22px;display:flex;align-items:center;justify-content:space-between}
.res-wrap{flex:1;padding:22px;max-width:860px;margin:0 auto;width:100%}
.res-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
@media(max-width:500px){.res-stat-grid{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);padding:15px 18px;text-align:center}
.stat-val{font-size:1.9rem;font-weight:700;font-family:'Space Grotesk',sans-serif}
.stat-lbl{font-size:.77rem;color:var(--text3);margin-top:3px}
.res-section{margin-bottom:22px}
.res-section-hd{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:var(--radius);margin-bottom:10px;font-weight:600;font-size:.9rem;border-left:4px solid}
.rsh-vocab{background:rgba(14,114,114,.09);border-color:var(--vocab);color:var(--vocab)}
.rsh-grammar{background:rgba(107,62,172,.09);border-color:var(--grammar);color:var(--grammar)}
.rsh-reading{background:rgba(184,72,0,.09);border-color:var(--reading);color:var(--reading)}
.res-row{display:flex;align-items:center;gap:12px;padding:10px 13px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:7px}
.res-row-info{flex:1}
.res-row-name{font-size:.88rem;font-weight:500}
.res-row-meta{font-size:.75rem;color:var(--text3);margin-top:2px}
.score-pill{padding:3px 9px;border-radius:20px;font-size:.77rem;font-weight:600}
.sp-hi{background:rgba(26,110,58,.13);color:var(--green)}
.sp-md{background:rgba(154,110,0,.13);color:var(--gold)}
.sp-lo{background:rgba(168,32,32,.13);color:var(--red)}
.mini-bar{height:6px;background:var(--bg3);border-radius:3px;width:80px;display:inline-block;vertical-align:middle;margin-left:8px;overflow:hidden}

/* PROF */
.prof-main{flex:1;padding:22px;max-width:1050px;margin:0 auto;width:100%}
.accordion{background:var(--bg1);border:1px solid var(--border);border-radius:var(--radius2);overflow:hidden;margin-bottom:11px}
.acc-head{padding:15px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .18s}
.acc-head:hover{background:var(--bg2)}
.acc-body{padding:0 18px 18px;border-top:1px solid var(--border)}
.ex-row{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--bg2);border-radius:var(--radius);margin-top:8px}
.ex-row-info{flex:1}
.ex-row-name{font-size:.88rem;font-weight:500;margin-bottom:2px}
.ex-row-meta{font-size:.74rem;color:var(--text3)}
.ex-row-actions{display:flex;gap:5px}
.vocab-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:11px 14px;font-size:.84rem;line-height:1.9;max-height:200px;overflow-y:auto;color:var(--text2);white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:.73rem;font-weight:500}
.tag-vocab{background:rgba(14,114,114,.12);color:var(--vocab)}
.tag-grammar{background:rgba(107,62,172,.12);color:var(--grammar)}
.tag-reading{background:rgba(184,72,0,.12);color:var(--reading)}
.prof-badge{background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);color:var(--gold);padding:2px 9px;border-radius:20px;font-size:.74rem;font-weight:600}
.chip{background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:4px 12px;font-size:.82rem;cursor:pointer;transition:all .18s}
.chip:hover{border-color:var(--accent)}.chip.act{background:rgba(26,95,168,.11);border-color:var(--accent);color:var(--accent)}
.empty{text-align:center;padding:44px 22px;color:var(--text3)}
.empty .ei{font-size:2.6rem;margin-bottom:10px}
.notif{position:fixed;bottom:22px;right:22px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--radius);padding:12px 17px;font-size:.87rem;box-shadow:var(--shadow2);z-index:300;animation:slideUp .25s ease;max-width:290px}
.notif.ok{border-left:3px solid var(--green);color:var(--green)}
.notif.er{border-left:3px solid var(--red);color:var(--red)}
.notif.in{border-left:3px solid var(--accent);color:var(--accent)}

/* UTILS */
.fw{width:100%}.flex{display:flex}.aic{align-items:center}.jbs{justify-content:space-between}
.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.tm{color:var(--text3)}.fw6{font-weight:600}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

/* ── STORAGE ── */
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v!=null?JSON.parse(v):d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const DEF_PROF='0504', DEF_STU='2024';
function boot(){if(!LS.get('bye_prof'))LS.set('bye_prof',DEF_PROF);if(!LS.get('bye_stu'))LS.set('bye_stu',DEF_STU);if(!LS.get('bye_extra'))LS.set('bye_extra',[]);if(!LS.get('bye_results'))LS.set('bye_results',[]);}
boot();

/* ── HARDCODED THEMES ── */
const HARDCODED_THEMES = [
  {
    "id": "v1",
    "name": "Security Jobs",
    "category": "vocab",
    "vocab": "agent de sécurité = security guard\nvigile = bouncer\npolicier = police officer\ndétective = detective\nenquêteur = investigator\nagent de sûreté aéroportuaire = airport security officer\ngarde du corps = bodyguard\nagent de surveillance = surveillance officer\nmaître-chien = K-9 officer\npompier = firefighter\nsecouriste = first aider\nagent pénitentiaire = prison officer\ndouanier = customs officer\nopérateur de vidéosurveillance = CCTV operator\ncyberanalyste = cybersecurity analyst\nconsultant en sécurité = security consultant\nmilitaire = soldier\ngarde-côte = coast guard officer\nsauveteur = rescuer\nagent de sécurité incendie = fire safety officer",
    "exercises": [
      {
        "name": "Match — Security Jobs (set 1)",
        "type": "match",
        "question": "Match each english term to its french equivalent.",
        "leftLabel": "English",
        "rightLabel": "French",
        "pairs": [
          {
            "left": "security guard",
            "right": "agent de sécurité"
          },
          {
            "left": "bouncer",
            "right": "vigile"
          },
          {
            "left": "police officer",
            "right": "policier"
          },
          {
            "left": "detective",
            "right": "détective"
          },
          {
            "left": "investigator",
            "right": "enquêteur"
          },
          {
            "left": "airport security officer",
            "right": "agent de sûreté aéroportuaire"
          },
          {
            "left": "bodyguard",
            "right": "garde du corps"
          },
          {
            "left": "surveillance officer",
            "right": "agent de surveillance"
          }
        ],
        "points": 10,
        "explanation": "Review the vocabulary list to memorise these terms."
      },
      {

ction, workplace safety, and crisis response.\n\n3. Technology Integration: AI surveillance, biometric scanning, threat detection software — the tools are advancing, and so is the need for skilled people to manage them.",

function getThemes(){
  const extra=LS.get('bye_extra',[]);
  const hardIds=HARDCODED_THEMES.map(t=>t.id);
  const profOnly=extra.filter(t=>!hardIds.includes(t.id));
  const merged=HARDCODED_THEMES.map(ht=>{
    const ov=extra.find(s=>s.id===ht.id);
    if(!ov) return ht;
    return {...ht, exercises:[...ht.exercises,...(ov.exercises||[])], vocab:ov.vocab||ht.vocab};
  });
  return [...merged,...profOnly];
}

function useNotif(){
  const [n,sN]=useState(null);
  function show(msg,type='in'){sN({msg,type,id:Date.now()});}
  function Comp(){if(!n)return null;return <Notif key={n.id} msg={n.msg} type={n.type} onDone={()=>sN(null)}/>;}
  return [Comp,show];
}

function CodeModal({title,sub,onSubmit,onClose}){

}

/* ── RUNNERS ── */
function RunQCM({ex,onDone}){
  const [sel,setSel]=useState(null);const [phase,setPhase]=useState('q');const [ok,setOk]=useState(false);
  function check(){const c=sel===ex.answer;setOk(c);setPhase('fb');}
  if(phase==='fb') return <FeedbackPanel ok={ok} score={ok?10:0} explanation={ex.explanation} onNext={()=>onDone(ok?10:0)}/>;
  return(<div><div className="choices">{(ex.choices||[]).map((c,i)=><button key={i} className={`choice${sel===i?' sel':''}`} onClick={()=>setSel(i)}>{c}</button>)}</div><button className="btn btn-primary" style={{marginTop:12}} disabled={sel===null} onClick={check}>Check</button></div>);
}

function RunMatch({ex,onDone}){
  const [lSel,setLSel]=useState(null);const [matched,setMatched]=useState({});const [done,setDone]=useState(false);
  const pairs=ex.pairs||[];
  const shuffled=useRef([...pairs].sort(()=>Math.random()-.5)).current;
  function clickL(w){if(!matched[w])setLSel(w);}
  function clickR(def){
    if(!lSel)return;
    const p=pairs.find(p=>p.right===def);
    if(p&&p.left===lSel){const nm={...matched,[lSel]:def};setMatched(nm);setLSel(null);if(Object.keys(nm).length===pairs.length)setDone(true);}
    else{setMatched(m=>({...m,[lSel]:'__x__'}));setTimeout(()=>setMatched(m=>{const n={...m};delete n[lSel];return n;}),600);setLSel(null);}
  }
  function submit(){const hits=pairs.filter(p=>matched[p.left]===p.right).length;onDone(Math.round(hits/pairs.length*10));}
  return(<div>
    <div className="match-grid">
      <div><div className="match-col-title">{ex.leftLabel||'English'}</div>{pairs.map((p,i)=>{const st=matched[p.left];return<div key={i} className={`match-item${lSel===p.left?' mi-sel':st==='__x__'?' mi-ko':st?' mi-ok':''}`} onClick={()=>!st&&clickL(p.left)}>{p.left}</div>;})} </div>
      <div><div className="match-col-title">{ex.rightLabel||'French'}</div>{shuffled.map((p,i)=>{const isMatched=Object.entries(matched).some(([k,v])=>v===p.right&&matched[k]===p.right);return<div key={i} className={`match-item${isMatched?' mi-ok':''}`} onClick={()=>!isMatched&&clickR(p.right)}>{p.right}</div>;})} </div>
    </div>
    {done&&<button className="btn btn-primary" onClick={submit}>See results</button>}
  </div>);
}

function RunFill({ex,onDone}){
  const [inp,setInp]=useState({});const [phase,setPhase]=useState('q');const [score,setScore]=useState(0);
  const blanks=ex.blanks||[];
  function check(){const hits=blanks.filter((_,i)=>(inp[i]||'').trim().toLowerCase()===(ex.answers||[])[i]?.toLowerCase()).length;const s=blanks.length?Math.round(hits/blanks.length*10):0;setScore(s);setPhase('fb');}
  if(phase==='fb') return <FeedbackPanel ok={score>=7} score={score} explanation={ex.explanation} onNext={()=>onDone(score)}/>;
  return(<div><div className="fill-sent">{blanks.map((part,i)=><span key={i}>{part}<input className="blank-inp" value={inp[i]||''} onChange={e=>setInp(s=>({...s,[i]:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&check()} placeholder="..."/></span>)}{ex.suffix||''}</div><button className="btn btn-primary" onClick={check}>Check</button></div>);
}

function RunErrorSingle({sentence,onDone}){
  const [sel,setSel]=useState(null);const [phase,setPhase]=useState('q');
  const words=sentence.sentence.split(' ');
  function check(){const ok=sel===sentence.errorWord;setPhase('fb');setTimeout(()=>onDone(ok?10:0),2200);}
  return(<div>
    <p className="tm" style={{fontSize:'.84rem',marginBottom:8}}>Click on the incorrect word:</p>
    <div className="error-sent">
      {words.map((w,i)=>{
        const isErr=phase==='fb'&&w===sentence.errorWord;
        const isWrong=phase==='fb'&&sel===w&&w!==sentence.errorWord;
        const isSel=phase==='q'&&sel===w;
        return<span key={i} className={`error-word${isSel?' ew-sel':isErr?' ew-ok':isWrong?' ew-ko':''}`} onClick={()=>phase==='q'&&setSel(w)}> {w}</span>;
      })}
    </div>
    {phase==='q'&&<button className="btn btn-primary" style={{marginTop:10}} disabled={!sel} onClick={check}>Check</button>}
    {phase==='fb'&&<div className={`feedback ${sel===sentence.errorWord?'fb-ok':'fb-ko'}`} style={{marginTop:10}}>
      {sel===sentence.errorWord?'✓ Correct!':'✗ Not quite.'}
      <div className="fb-exp"><strong>Correction:</strong> {sentence.correction} — {sentence.explanation}</div>
    </div>}
  </div>);
}

/* ── SEQUENCE RUNNERS ── */
function RunQCMSequence({ex,onDone}){
  const [idx,setIdx]=useState(0);const [scores,setScores]=useState([]);
  const qs=ex.questions||[];
  function next(score){
    const ns=[...scores,score];setScores(ns);
    if(idx+1<qs.length)setIdx(i=>i+1);
    else onDone(Math.round(ns.reduce((a,b)=>a+b,0)/ns.length));
  }
  if(!qs.length)return null;
  const q=qs[idx];
  return(<div>
    <div className="flex jbs aic" style={{marginBottom:8}}><span className="tm" style={{fontSize:'.8rem'}}>Q {idx+1}/{qs.length}</span><span className="tm" style={{fontSize:'.8rem'}}>{scores.reduce((a,b)=>a+b,0)}/{scores.length*10} pts</span></div>
    <div className="seq-progress"><div className="seq-bar-grammar" style={{width:Math.round(idx/qs.length*100)+'%'}}/></div>
    <div className="ex-q" style={{marginBottom:14}}>{q.question}</div>
    <RunQCM key={idx} ex={q} onDone={next}/>
  </div>);
}

  function next(score){
    const ns=[...scores,score];setScores(ns);
    if(qIdx+1<qs.length)setQIdx(i=>i+1);
    else onDone(Math.round(ns.reduce((a,b)=>a+b,0)/ns.length));
  }
  if(!qs.length)return<div className="tm">No questions configured.</div>;
  const q=qs[qIdx];
  return(<div>
    <div className="flex aic g8" style={{marginBottom:12}}>
      <button className="btn btn-ghost btn-sm" onClick={()=>setShowPdf(s=>!s)}>{showPdf?'Hide text 📄':'Show text 📄'}</button>
      <span className="tm" style={{fontSize:'.8rem'}}>Q {qIdx+1}/{qs.length}</span>
    </div>
    {showPdf&&<div className="pdf-reader">
      {ex.pdfBase64?<embed src={`data:application/pdf;base64,${ex.pdfBase64}`} className="pdf-embed" type="application/pdf"/>
       :ex.textContent?<div style={{padding:20,background:'#fff',fontSize:'.88rem',lineHeight:1.85,maxHeight:360,overflowY:'auto',color:'#222',whiteSpace:'pre-wrap'}}>{ex.textContent}</div>
       :<div className="pdf-fallback">No reading text configured yet.</div>}
    </div>}
    <div className="ex-box" style={{marginTop:0}}>
      <div className="ex-head"><span className="type-badge tb-reading">Reading Q{qIdx+1}</span><span className="tm" style={{fontSize:'.8rem'}}>{q.points||10} pts</span></div>
      <div className="ex-q">{q.question}</div>
      <RunQCM key={qIdx} ex={{choices:q.choices,answer:q.answer,explanation:q.explanation}} onDone={next}/>
    </div>
  </div>);
}

/* ── EX RUNNER DISPATCHER ── */
function ExRunner({ex,onDone}){
  const type=ex.type;
  const bm={qcm:'tb-qcm',qcm_sequence:'tb-qcm',match:'tb-match',fill:'tb-fill',fill_sequence:'tb-fill',error:'tb-error',error_sequence:'tb-error',reading:'tb-reading'};
  const lm={qcm:'MCQ',qcm_sequence:'MCQ Series',match:'Matching',fill:'Fill in',fill_sequence:'Fill in Series',error:'Find the Error',error_sequence:'Error Series',reading:'Reading'};
  return(<div className="ex-box">
    <div className="ex-head"><span className={`type-badge ${bm[type]||'tb-qcm'}`}>{lm[type]||type}</span><span className="tm" style={{fontSize:'.8rem'}}>{ex.points||10} XP</span></div>
    <div className="ex-q">{ex.question}</div>
    {type==='qcm'&&<RunQCM ex={ex} onDone={onDone}/>}
    {type==='qcm_sequence'&&<RunQCMSequence ex={ex} onDone={onDone}/>}
    {type==='match'&&<RunMatch ex={ex} onDone={onDone}/>}
    {type==='fill'&&<RunFill ex={ex} onDone={onDone}/>}
    {type==='fill_sequence'&&<RunFillSequence ex={ex} onDone={onDone}/>}
    {type==='error_sequence'&&<RunErrorSequence ex={ex} onDone={onDone}/>}
    {type==='reading'&&<RunReading ex={ex} onDone={onDone}/>}
  </div>);
}

    const w=window.open('','_blank');w.document.write(html);w.document.close();w.print();

  return(<div className="results-page">

    </div>
    <div className="res-wrap">
      {total===0?(<div className="empty"><div className="ei">📊</div><p>No results yet. Complete some exercises first!</p></div>):(<>
        <div className="res-stat-grid" style={{marginBottom:22}}>

          <div className="stat-card"><div className="stat-val" style={{color:'var(--green)'}}>{avgScore}%</div><div className="stat-lbl">Average score</div></div>

  const typeLabel={qcm:'QCM',qcm_sequence:'QCM Series',match:'Match',fill:'Fill in',fill_sequence:'Fill Series',error:'Error',error_sequence:'Error Series',reading:'Reading'};
  const typeBadge={qcm:'tb-qcm',qcm_sequence:'tb-qcm',match:'tb-match',fill:'tb-fill',fill_sequence:'tb-fill',error:'tb-error',error_sequence:'tb-error',reading:'tb-reading'};

  function addTheme(){
    if(!newTheme.name.trim())return;
    const t=[...extra,{id:'p_'+Date.now(),name:newTheme.name.trim(),category:newTheme.category,exercises:[],vocab:'',created:new Date().toLocaleDateString('en-GB')}];
    setExtra(t);setSAT(false);setNT({name:'',category:'vocab'});notify('Theme added','ok');
  }
  function delTheme(id){
    if(!confirm('Delete this theme?'))return;
    const hardId=HARDCODED_THEMES.find(h=>h.id===id);
    if(hardId){notify('Cannot delete built-in themes','er');return;}
    setExtra(extra.filter(t=>t.id!==id));notify('Deleted','in');
  }
  function saveEx(tid,ex,idx){
    // Find if prof-only or hardcoded
    const isHard=HARDCODED_THEMES.find(h=>h.id===tid);
    let updated;
    if(isHard){
      // Store additions in extra override
      const ov=extra.find(e=>e.id===tid)||{...isHard,exercises:[]};
      const exs=[...(ov.exercises||[])];
      if(idx!=null)exs[idx]=ex;else exs.push(ex);
      const others=extra.filter(e=>e.id!==tid);
      updated=[...others,{...ov,exercises:exs}];
    } else {
      updated=extra.map(t=>{if(t.id!==tid)return t;const exs=[...(t.exercises||[])];if(idx!=null)exs[idx]=ex;else exs.push(ex);return{...t,exercises:exs};});
    }
    setExtra(updated);setSEM(null);notify('Exercise saved','ok');
  }
  function delEx(tid,exRelIdx){
    if(!confirm('Delete?'))return;
    const t=allThemes.find(t=>t.id===tid);if(!t)return;
    const ex=t.exercises[exRelIdx];

      // Check if it's a prof-added exercise
      const ov=extra.find(e=>e.id===tid);

      const ovIdx=ov.exercises.indexOf(ex);

    } else {

      setExtra(updated);
    }
    notify('Deleted','in');

  }
  function updateCode(){if(!newCode.trim())return;LS.set('bye_stu',newCode.trim());setSC(false);setNC('');notify('Code updated','ok');}

  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <div className="topbar">
      <div className="flex aic g10"><span style={{fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)',fontSize:'1.05rem'}}>Boost Your English — MOS</span><span className="prof-badge">Teacher</span></div>
      <div className="flex g8"><button className="btn btn-ghost btn-sm" onClick={()=>setSC(true)}>🔑 Student code</button><button className="btn btn-ghost btn-sm" onClick={onLogout}>Exit</button></div>
    </div>
    <div className="prof-main">
      <div className="flex jbs aic" style={{marginBottom:18}}>
        <div><h2>Exercise library</h2><p className="tm" style={{marginTop:4,fontSize:'.86rem'}}>Exercises are shared between MOS 1 and MOS 2.</p></div>
        <button className="btn btn-primary" onClick={()=>setSAT(true)}>+ Theme</button>
      </div>
      <div className="cat-tabs" style={{marginBottom:16}}>
        {[['all','All','all-act'],['vocab','📘 Vocabulary','vocab-act'],['grammar','📗 Grammar','grammar-act'],['reading','📙 Reading','reading-act']].map(([k,l,cls])=>(
          <button key={k} className={`cat-tab${catFilter===k?' '+cls:''}`} onClick={()=>setCatFilter(k)}>{l}</button>
        ))}
      </div>
      {filtThemes.length===0&&<div className="empty"><div className="ei">📚</div><p>No themes yet.</p></div>}
      {filtThemes.map(th=>(
        <div key={th.id} className="accordion">
          <div className="acc-head" onClick={()=>setExpanded(e=>({...e,[th.id]:!e[th.id]}))}>
            <div className="flex aic g8">
              <span style={{fontSize:'.76rem',display:'inline-block',transform:expanded[th.id]?'rotate(90deg)':'none',transition:'transform .2s'}}>▶</span>
              <span className="fw6">{th.name}</span>
              <span className={`tag tag-${th.category}`}>{catLabel(th.category)}</span>
              <span className="tm" style={{fontSize:'.79rem'}}>{(th.exercises||[]).length} ex.</span>
              {HARDCODED_THEMES.find(h=>h.id===th.id)&&<span style={{fontSize:'.7rem',background:'rgba(26,95,168,.1)',color:'var(--accent)',padding:'1px 7px',borderRadius:20}}>built-in</span>}
            </div>
            <div className="flex g6" onClick={e=>e.stopPropagation()} style={{gap:6}}>
              {th.category==='vocab'&&<button className="btn btn-ghost btn-sm" onClick={()=>{setVM(th.id);setVT(th.vocab||'');}}>📋 Vocab</button>}
              <button className="btn btn-primary btn-sm" onClick={()=>setSEM({tid:th.id,category:th.category})}>+ Exercise</button>
              {!HARDCODED_THEMES.find(h=>h.id===th.id)&&<button className="btn-icon btn-trash" onClick={()=>delTheme(th.id)}>🗑</button>}
            </div>
          </div>
          {expanded[th.id]&&<div className="acc-body">
            {th.category==='vocab'&&th.vocab&&<div style={{marginBottom:12}}>
              <div className="flex aic g8" style={{marginBottom:7}}><span className="tm" style={{fontSize:'.8rem'}}>Vocabulary list</span><button className="btn btn-ghost btn-sm" onClick={()=>setSV(s=>({...s,[th.id]:!s[th.id]}))}>{ showVocab[th.id]?'Hide':'Show'}</button></div>
              {showVocab[th.id]&&<div className="vocab-area">{th.vocab}</div>}
            </div>}
            {!(th.exercises||[]).length&&<p className="tm" style={{padding:'10px 0',fontSize:'.86rem'}}>No exercises yet.</p>}
            {(th.exercises||[]).map((ex,i)=>(
              <div key={i} className="ex-row">
                <div className="ex-row-info"><div className="ex-row-name">{ex.name||'Unnamed'}</div><div className="ex-row-meta"><span className={`type-badge ${typeBadge[ex.type]||'tb-qcm'}`} style={{fontSize:'.69rem',padding:'1px 7px'}}>{typeLabel[ex.type]||ex.type}</span> {ex.points||10} pts</div></div>
                <div className="ex-row-actions">
                  <button className="btn-icon btn-edit" onClick={()=>setSEM({tid:th.id,idx:i,initial:ex,category:th.category})}>✎</button>
                  <button className="btn-icon btn-trash" onClick={()=>delEx(th.id,i)}>🗑</button>
                </div>
              </div>
            ))}
          </div>}
        </div>
      ))}
    </div>

    {showAddTheme&&<div className="overlay"><div className="modal">
      <h2>Add theme</h2><p>Create a new theme in the exercise library.</p>
      <label style={{fontSize:'.82rem',color:'var(--text3)'}}>Theme name</label>
      <input style={{width:'100%',marginTop:5,marginBottom:12}} placeholder="e.g. Present Perfect" value={newTheme.name} onChange={e=>setNT(n=>({...n,name:e.target.value}))} onKeyDown={e=>e.key==='Enter'&&addTheme()}/>
      <label style={{fontSize:'.82rem',color:'var(--text3)'}}>Category</label>
      <select style={{width:'100%',marginTop:5}} value={newTheme.category} onChange={e=>setNT(n=>({...n,category:e.target.value}))}>
        <option value="vocab">📘 Vocabulary</option><option value="grammar">📗 Grammar</option><option value="reading">📙 Reading</option>
      </select>
      <div className="modal-btns"><button className="btn btn-ghost" onClick={()=>setSAT(false)}>Cancel</button><button className="btn btn-primary" onClick={addTheme}>Add</button></div>
    </div></div>}

    {showExModal&&<ExModal initial={showExModal.initial} category={showExModal.category} onSave={ex=>saveEx(showExModal.tid,ex,showExModal.idx??null)} onClose={()=>setSEM(null)}/>}

    {showCode&&<div className="overlay"><div className="modal">
      <h2>Student access code</h2><p>Current: <strong style={{color:'var(--accent)'}}>{LS.get('bye_stu',DEF_STU)}</strong></p>
      <input style={{width:'100%'}} placeholder="New code" value={newCode} onChange={e=>setNC(e.target.value)} maxLength={12}/>
      <div className="modal-btns"><button className="btn btn-ghost" onClick={()=>setSC(false)}>Cancel</button><button className="btn btn-primary" onClick={updateCode}>Update</button></div>
    </div></div>}

    {vocabModal&&<div className="overlay"><div className="modal" style={{maxWidth:520}}>
      <h2>Vocabulary list</h2><p>Paste the vocabulary list for this theme.</p>
      <textarea style={{width:'100%',minHeight:200,fontFamily:'monospace',fontSize:'.83rem'}} value={vocabTxt} onChange={e=>setVT(e.target.value)} placeholder={"word - definition\n..."}/>
      <div className="modal-btns"><button className="btn btn-danger btn-sm" onClick={()=>{setVT('');saveVocab(vocabModal);}}>Clear</button><div style={{flex:1}}/><button className="btn btn-ghost" onClick={()=>setVM(null)}>Cancel</button><button className="btn btn-primary" onClick={()=>saveVocab(vocabModal)}>Save</button></div>
    </div></div>}
    <Notif/>
  </div>);
}

/* ── RGPD PAGE ── */
function RGPDPage({onBack}){
  return(<div style={{minHeight:'100vh',display:'flex',flexDirection:'column'}}>
    <div className="topbar"><button className="btn btn-ghost btn-sm" onClick={onBack}>← Back</button><span style={{fontFamily:'Space Grotesk',fontWeight:700,color:'var(--accent)'}}>Data Privacy — RGPD</span><div/></div>
    <div style={{flex:1,padding:32,maxWidth:760,margin:'0 auto',width:'100%'}}>
      <h2 style={{marginBottom:16}}>Privacy Policy</h2>
      <div style={{background:'var(--bg1)',border:'1px solid var(--border)',borderRadius:'var(--radius2)',padding:28,color:'var(--text3)',fontSize:'.92rem',lineHeight:1.9,minHeight:300}}>
        <p style={{fontStyle:'italic'}}>This page is under construction. The privacy policy will be added here once validated.</p>
      </div>
    </div>
  </div>);
}

/* ── ROOT ── */
function App(){
  const [view,setView]=useState('home');
  const [prompt,setPrompt]=useState(null);
  function tryProf(c){const ok=c===LS.get('bye_prof',DEF_PROF);if(ok){setPrompt(null);setView('prof');}return ok;}
  function tryStu(c){const ok=c===LS.get('bye_stu',DEF_STU);if(ok){setPrompt(null);setView('student');}return ok;}
  if(view==='student')return<StudentApp onLogout={()=>setView('home')}/>;
  if(view==='prof')return<ProfApp onLogout={()=>setView('home')}/>;
  if(view==='rgpd')return<RGPDPage onBack={()=>setView('home')}/>;
  return(<div className="home">
    <div className="home-grid"/><div className="home-glow"/>
    <div className="flags-row"><div className="flag"><FlagUK/></div><div className="flag"><FlagUS/></div><div className="flag"><FlagAU/></div></div>
    <div className="home-title"><span className="boost">Boost</span> Your English<span className="mos-badge">MOS</span></div>
    <div className="home-sub">English Practice Platform</div>
    <div className="home-cards">
      <div className="home-card" onClick={()=>setPrompt('student')}>
        <div className="ci">🎓</div><h3>Student access</h3><p>Practise &amp; track your progress</p>
        <div style={{marginTop:12,display:'inline-block',background:'rgba(26,95,168,.1)',border:'1px solid rgba(26,95,168,.28)',borderRadius:20,padding:'4px 13px',fontSize:'.78rem',color:'var(--accent)'}}>Enter code →</div>
      </div>
      <div className="home-card" onClick={()=>setPrompt('prof')}>
        <div className="ci">👩‍🏫</div><h3>Teacher access</h3><p>Manage exercises &amp; content</p>
        <div style={{marginTop:12,display:'inline-block',background:'rgba(154,110,0,.09)',border:'1px solid rgba(154,110,0,.26)',borderRadius:20,padding:'4px 13px',fontSize:'.78rem',color:'var(--gold)'}}>Enter code →</div>
      </div>
    </div>
    {prompt==='student'&&<CodeModal title="Student access" sub="Enter your access code to start." onSubmit={tryStu} onClose={()=>setPrompt(null)}/>}
    {prompt==='prof'&&<CodeModal title="Teacher access" sub="Enter your teacher code." onSubmit={tryProf} onClose={()=>setPrompt(null)}/>}
    <div className="home-footer">
      <span className="home-credit">Créé par C. Iemfre</span>
      <button className="btn-rgpd" onClick={()=>setView('rgpd')}>🔒 Data Privacy (RGPD)</button>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
