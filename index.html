<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>Boost Your English — MOS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#e8e8e8;--bg1:#d8d8d8;--bg2:#cecece;--bg3:#c2c2c2;--bg4:#f2f2f2;--border:#b0b0b0;--text1:#111;--text2:#333;--text3:#666;--accent:#1a5fa8;--accent2:#144d8a;--gold:#9a6e00;--green:#1a6e3a;--red:#a82020;--vocab:#0e7272;--grammar:#6b3eac;--reading:#b84800;--r:10px;--r2:16px;}
body{font-family:'Outfit',sans-serif;background:var(--bg0);color:var(--text1);min-height:100vh}
button{cursor:pointer;font-family:'Outfit',sans-serif;border:none;transition:all .18s}
input,select,textarea{font-family:'Outfit',sans-serif;background:var(--bg3);border:1px solid var(--border);color:var(--text1);border-radius:var(--r);padding:.6rem 1rem;font-size:.95rem;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical}
h2,h3{font-family:'Space Grotesk',sans-serif}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
#app{min-height:100vh}
.center{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:32px;width:100%;max-width:420px}
.topbar{background:var(--bg1);border-bottom:1px solid var(--border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between}
.flex-col{display:flex;flex-direction:column;min-height:100vh}
.page{flex:1;padding:22px;max-width:820px;margin:0 auto;width:100%}
.btn{padding:.6rem 1.3rem;border-radius:var(--r);font-size:.88rem;font-weight:600;cursor:pointer;border:none;transition:all .18s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent2)}
.btn-ghost{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--bg3)}
.btn-sm{padding:.35rem .8rem;font-size:.8rem}
.btn-icon{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:.9rem;cursor:pointer;border:none;background:rgba(168,32,32,.1);color:var(--red)}
.btn-icon:hover{background:rgba(168,32,32,.2)}
.home{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:var(--bg0);padding:20px 20px 70px}
.home-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,0,0,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.05) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.home-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.flags{display:flex;gap:12px;margin-bottom:26px}
.flag{width:52px;height:34px;border-radius:6px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.flag svg{width:100%;height:100%}
.home-title{font-family:'Space Grotesk',sans-serif;font-size:2.6rem;font-weight:700;text-align:center;line-height:1.1;max-width:500px}
.boost{color:var(--accent)}
.mos-badge{display:inline-block;background:var(--accent);color:#fff;font-size:.95rem;padding:3px 12px;border-radius:20px;vertical-align:middle;margin-left:8px;font-weight:600}
.home-sub{color:var(--text3);font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;margin-top:8px}
.home-cards{display:flex;gap:14px;margin-top:40px}
@media(max-width:520px){.home-cards{flex-direction:column;width:100%;max-width:320px}.home-title{font-size:1.9rem}}
.home-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:24px 28px;text-align:center;cursor:pointer;transition:all .22s;flex:1;min-width:150px}
.home-card:hover{border-color:var(--accent);background:var(--bg2);transform:translateY(-3px);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.home-card .ci{font-size:2rem;margin-bottom:8px}
.home-card h3{font-size:1rem;margin-bottom:4px}
.home-card p{color:var(--text3);font-size:.8rem}
.hcard-btn{display:inline-block;margin-top:10px;padding:3px 12px;border-radius:20px;font-size:.76rem;font-weight:600}
.home-footer{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:var(--bg1);border-top:1px solid var(--border);z-index:1}
.credit{color:var(--text3);font-size:.77rem}
.btn-rgpd{background:transparent;border:1px solid var(--border);color:var(--text3);border-radius:20px;padding:5px 14px;font-size:.76rem;cursor:pointer}
.btn-rgpd:hover{border-color:var(--accent);color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:32px;width:100%;max-width:440px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:90vh;overflow-y:auto}
.modal h2{margin-bottom:6px}.modal p{color:var(--text3);font-size:.88rem;margin-bottom:16px}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.cat-tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.cat-tab{padding:7px 16px;border-radius:20px;font-size:.83rem;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--bg2);transition:all .18s}
.ct-all.on{background:rgba(26,95,168,.1);border-color:var(--accent);color:var(--accent)}
.ct-vocab.on{background:rgba(14,114,114,.12);border-color:var(--vocab);color:var(--vocab)}
.ct-grammar.on{background:rgba(107,62,172,.12);border-color:var(--grammar);color:var(--grammar)}
.ct-reading.on{background:rgba(184,72,0,.12);border-color:var(--reading);color:var(--reading)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:11px}
.theme-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:16px;cursor:pointer;transition:all .22s}
.theme-card:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(0,0,0,.1)}
.tc-vocab:hover{border-color:var(--vocab)}.tc-grammar:hover{border-color:var(--grammar)}.tc-reading:hover{border-color:var(--reading)}
.tc-icon{font-size:1.5rem;margin-bottom:7px}.tc-name{font-size:.9rem;font-weight:600;margin-bottom:3px}.tc-count{color:var(--text3);font-size:.76rem}
.prog-bar{height:4px;background:var(--bg3);border-radius:2px;margin-top:9px;overflow:hidden}
.pf-vocab{height:100%;border-radius:2px;background:var(--vocab);transition:width .4s}
.pf-grammar{height:100%;border-radius:2px;background:var(--grammar);transition:width .4s}
.pf-reading{height:100%;border-radius:2px;background:var(--reading);transition:width .4s}
.prog-lbl{font-size:.71rem;color:var(--text3);margin-top:4px}
.xp-pill{display:flex;align-items:center;gap:6px;background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);border-radius:20px;padding:4px 12px;font-size:.83rem;font-weight:600;color:var(--gold)}
.app-name{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:1rem;color:var(--accent)}
.prof-badge{background:rgba(154,110,0,.1);border:1px solid rgba(154,110,0,.28);color:var(--gold);padding:2px 8px;border-radius:20px;font-size:.72rem;font-weight:600}
.ex-box{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:24px;margin-bottom:16px}
.ex-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ex-q{font-size:1.05rem;margin-bottom:16px;line-height:1.65}
.type-badge{padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600;text-transform:uppercase}
.tb-qcm{background:rgba(26,95,168,.12);color:var(--accent)}
.tb-match{background:rgba(14,114,114,.12);color:var(--vocab)}
.tb-fill{background:rgba(107,62,172,.12);color:var(--grammar)}
.tb-error{background:rgba(168,32,32,.12);color:var(--red)}
.tb-reading{background:rgba(184,72,0,.12);color:var(--reading)}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 14px;cursor:pointer;text-align:left;font-size:.92rem;color:var(--text1);width:100%;transition:all .18s}
.choice:hover{background:var(--bg3);border-color:var(--accent)}
.choice.sel{border-color:var(--accent);background:rgba(26,95,168,.09)}
.choice.ok{border-color:var(--green);background:rgba(26,110,58,.09);color:var(--green)}
.choice.ko{border-color:var(--red);background:rgba(168,32,32,.09);color:var(--red)}
.blank-inp{border:none;border-bottom:2px solid var(--accent);background:transparent;text-align:center;font-size:.95rem;padding:.3rem .4rem;margin:0 3px;color:var(--text1);outline:none;width:130px;font-family:'Outfit',sans-serif}
.fill-sent{font-size:1rem;line-height:2.6;margin-bottom:16px}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.match-col-title{font-size:.76rem;color:var(--text3);margin-bottom:4px;font-weight:600}
.mi{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:9px 12px;cursor:pointer;font-size:.86rem;transition:all .18s;min-height:40px;display:flex;align-items:center}
.mi:hover{border-color:var(--accent)}
.mi-sel{border-color:var(--gold)!important;background:rgba(154,110,0,.09);color:var(--gold)}
.mi-ok{border-color:var(--green)!important;background:rgba(26,110,58,.09);color:var(--green);pointer-events:none}
.error-sent{font-size:1rem;line-height:1.9;background:var(--bg2);padding:13px 16px;border-radius:var(--r);border:1px solid var(--border);margin-bottom:14px}
.ew{cursor:pointer;padding:1px 4px;border-radius:4px;border:1px solid transparent;transition:all .15s;display:inline}
.ew:hover{background:rgba(168,32,32,.1);border-color:rgba(168,32,32,.3)}
.ew-sel{background:rgba(168,32,32,.14);color:var(--red);font-weight:600;border-color:var(--red)}
.ew-ok{background:rgba(26,110,58,.12);color:var(--green);font-weight:600;border-color:var(--green)}
.ew-ko{background:rgba(168,32,32,.12);color:var(--red);border-color:var(--red)}
.feedback{border-left:4px solid;border-radius:var(--r);padding:12px 15px;margin-top:12px;font-size:.87rem;line-height:1.7;background:var(--bg2)}
.fb-ok{border-color:var(--green);color:var(--green)}.fb-ko{border-color:var(--red);color:var(--text1)}
.fb-exp{color:var(--text2);margin-top:5px}
.score-box{text-align:center;padding:20px;background:var(--bg2);border-radius:var(--r2);margin-top:12px}
.score-big{font-size:2.6rem;font-weight:700;font-family:'Space Grotesk',sans-serif;color:var(--gold)}
.seq-prog{height:4px;background:var(--bg3);border-radius:2px;margin-bottom:14px;overflow:hidden}
.sp-g{height:100%;border-radius:2px;background:var(--grammar);transition:width .3s}
.sp-r{height:100%;border-radius:2px;background:var(--red);transition:width .3s}
.pdf-text{background:#fff;color:#222;padding:18px;font-size:.88rem;line-height:1.85;max-height:320px;overflow-y:auto;border-radius:var(--r);border:1px solid var(--border);white-space:pre-wrap;margin-bottom:14px}
.res-stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat-card{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:14px;text-align:center}
.stat-val{font-size:1.8rem;font-weight:700;font-family:'Space Grotesk',sans-serif}
.stat-lbl{font-size:.75rem;color:var(--text3);margin-top:2px}
.res-sec-hd{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:var(--r);margin-bottom:8px;font-weight:600;font-size:.88rem;border-left:4px solid}
.rsh-vocab{background:rgba(14,114,114,.09);border-color:var(--vocab);color:var(--vocab)}
.rsh-grammar{background:rgba(107,62,172,.09);border-color:var(--grammar);color:var(--grammar)}
.rsh-reading{background:rgba(184,72,0,.09);border-color:var(--reading);color:var(--reading)}
.res-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg1);border:1px solid var(--border);border-radius:var(--r);margin-bottom:6px}
.sp{padding:3px 8px;border-radius:20px;font-size:.75rem;font-weight:600}
.sp-hi{background:rgba(26,110,58,.13);color:var(--green)}
.sp-md{background:rgba(154,110,0,.13);color:var(--gold)}
.sp-lo{background:rgba(168,32,32,.13);color:var(--red)}
.mini-bar{height:5px;background:var(--bg3);border-radius:3px;width:70px;display:inline-block;vertical-align:middle;margin-left:7px;overflow:hidden}
.accordion{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);overflow:hidden;margin-bottom:10px}
.acc-head{padding:14px 17px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;transition:background .18s}
.acc-head:hover{background:var(--bg2)}
.acc-body{padding:0 17px 17px;border-top:1px solid var(--border)}
.ex-row{display:flex;align-items:center;gap:9px;padding:9px 10px;background:var(--bg2);border-radius:var(--r);margin-top:7px}
.ex-row-info{flex:1}.ex-row-name{font-size:.87rem;font-weight:500;margin-bottom:2px}.ex-row-meta{font-size:.73rem;color:var(--text3)}
.vocab-area{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 13px;font-size:.82rem;line-height:1.85;max-height:180px;overflow-y:auto;color:var(--text2);white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:.71rem;font-weight:500}
.tag-vocab{background:rgba(14,114,114,.12);color:var(--vocab)}
.tag-grammar{background:rgba(107,62,172,.12);color:var(--grammar)}
.tag-reading{background:rgba(184,72,0,.12);color:var(--reading)}
.notif{position:fixed;bottom:20px;right:20px;background:var(--bg4);border:1px solid var(--border);border-radius:var(--r);padding:11px 16px;font-size:.85rem;box-shadow:0 6px 24px rgba(0,0,0,.16);z-index:200;max-width:280px}
.notif-ok{border-left:3px solid var(--green);color:var(--green)}
.notif-er{border-left:3px solid var(--red);color:var(--red)}
.notif-in{border-left:3px solid var(--accent);color:var(--accent)}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty .ei{font-size:2.4rem;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.tm{color:var(--text3)}.fw6{font-weight:600}
.id-preview{text-align:center;margin-bottom:12px;padding:7px;background:var(--bg2);border-radius:var(--r);font-size:1.1rem;font-weight:700;color:var(--accent);letter-spacing:3px;display:none}
.ref-modal{background:var(--bg1);border:1px solid var(--border);border-radius:var(--r2);padding:28px;width:100%;max-width:560px;box-shadow:0 8px 40px rgba(0,0,0,.2);max-height:88vh;overflow-y:auto}
.ref-section{margin-bottom:14px}
.ref-label{font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.ref-item{font-size:.85rem;line-height:1.65;margin-bottom:5px;padding:5px 10px;background:var(--bg2);border-radius:var(--r)}
.ref-item-border{border-left:3px solid}
.ref-signals{font-size:.84rem;line-height:1.65;padding:6px 10px;border-radius:var(--r);border-left:3px solid var(--vocab);background:rgba(14,114,114,.07)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.ain{animation:slideUp .22s ease both}
</style>
</head>

<script type="application/json" id="td">[{"id":"v1","name":"Security Jobs","category":"vocab","vocab":"agent de securite = security guard\nvigile = bouncer\npolicier = police officer\ndetective = detective\nenqueteur = investigator\nagent de surete aeroportuaire = airport security officer\ngarde du corps = bodyguard\nagent de surveillance = surveillance officer\nmaitre-chien = K-9 officer\npompier = firefighter\nsecouriste = first aider\nagent penitentiaire = prison officer\ndouanier = customs officer\noperateur de videosurveillance = CCTV operator\ncyberanalyste = cybersecurity analyst\nconsultant en securite = security consultant\nmilitaire = soldier\ngarde-cote = coast guard officer\nsauveteur = rescuer\nagent de securite incendie = fire safety officer","exercises":[{"name":"Match - Security Jobs (1)","type":"match","question":"Match each english term to its french equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"security guard","right":"agent de securite"},{"left":"bouncer","right":"vigile"},{"left":"police officer","right":"policier"},{"left":"detective","right":"detective"},{"left":"investigator","right":"enqueteur"},{"left":"airport security officer","right":"agent de surete aeroportuaire"},{"left":"bodyguard","right":"garde du corps"},{"left":"surveillance officer","right":"agent de surveillance"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Security Jobs (2)","type":"match","question":"Match each english term to its french equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"K-9 officer","right":"maitre-chien"},{"left":"firefighter","right":"pompier"},{"left":"first aider","right":"secouriste"},{"left":"prison officer","right":"agent penitentiaire"},{"left":"customs officer","right":"douanier"},{"left":"CCTV operator","right":"operateur de videosurveillance"},{"left":"cybersecurity analyst","right":"cyberanalyste"},{"left":"security consultant","right":"consultant en securite"}]," ngular + base verb."},{"blanks":["Who ___ (be) in charge of the access control system?"],"answers":["is"],"explanation":"Who + is (subject question with 'be')."},{"blanks":["","___ the director ___ (hold) a briefing every Monday?"],"answers":["Does","hold"],"explanation":"Does + singular + base verb: hold."},{"blanks":["What ___ the main duties of a night shift security officer?"],"answers":["are"],"explanation":"Main duties (plural): What + are?"},{"blanks":["","___ all security personnel trained in first aid?"],"answers":["Are"],"explanation":"Yes/no with 'be' + plural + past participle: Are + trained?"},{"blanks":["Why ___ the operations manager ___ (not / attend) the crisis drill last week?"],"answers":["did","attend"],"explanation":"Past simple question: Why + did + subject + base verb?"}],"points":10,"explanation":"Yes/no with BE: Is/Are + subject? With other verbs: Do/Does + base verb? WH: WH + auxiliary + subject + base verb?"},{"name":"Question Formation - Find the Error","type":"error_sequence","sentences":[{"sentence":"Is the security guards are ready for the evacuation drill?","errorWord":"Is","correction":"Are","explanation":"The security guards (plural): Are the security guards ready? (remove the second 'are')."},{"sentence":"Does the supervisor approves all access requests?","errorWord":"approves","correction":"approve","explanation":"After Does: base verb -> approve (not approves)."},{"sentence":"Where does the night shift manager keeps the patrol log?","errorWord":"keeps","correction":"keep","explanation":"After does: base verb -> keep (not keeps)."},{"sentence":"How many officers does work in the control room at night?","errorWord":"does","correction":"do","explanation":"How many officers (plural): do + work."},{"sentence":"Who manages the security operations in this sector does?","errorWord":"does","correction":"","explanation":"Who as subject: no auxiliary needed. Just: Who manages the security operations?"},{"sentence":"Do the team leader attend ment?","errorWord":"have","correction":"has","explanation":"The security director (singular): has."},{"sentence":"The company has recently introduce a new crisis management system.","errorWord":"introduce","correction":"introduced","explanation":"Present Perfect: has + PAST PARTICIPLE -> introduced."},{"sentence":"The operations centre have upgraded its surveillance systems twice this year.","errorWord":"have","correction":"has","explanation":"The operations centre (singular): has upgraded."},{"sentence":"Has you ever attended a full-scale emergency simulation?","errorWord":"Has","correction":"Have","explanation":"With you: Have you ever...? (not Has)."},{"sentence":"The management team haven't yet reached a decision on the contract.","errorWord":"haven't","correction":"hasn't","explanation":"The management team (singular collective): hasn't yet reached."}],"points":10,"explanation":"has/have + PAST PARTICIPLE. Has for singular, have for plural/I/you. Yet at end of sentence in negatives."}]},{"id":"g7","name":"Future with WILL","category":"grammar","vocab":"","exercises":[{"name":"Future with WILL - MCQ","type":"qcm_sequence","questions":[{"question":"The director ___ (announce) the new security policy at tomorrow's briefing.","choices":["announces","is going to announce","will announce","is announcing"],"answer":2,"explanation":"Prediction/decision at moment of speaking: will + base verb."},{"question":"I think the management team ___ (implement) stricter access controls next month.","choices":["implements","is going to implement","will implement","implement"],"answer":2,"explanation":"Prediction based on opinion (I think): will + base verb."},{"question":"___ the officers ___ (receive) their new equipment next week?","choices":["Are / going to receive","Will / receive","Does / receive","Are / receiving"],"answer":1,"explanation":"Future with will question: Will + subject + base verb?"},{"question":"Don't worry - the supervisor ___ (deal) with the situation immedia ad of security going to present the annual risk report?","Is the new head of security going to present the annual risk report?","Does the new head of security going to present the annual risk report?"],"answer":2,"explanation":"Singular: Is. After going to: base verb present (not presents)."},{"question":"Which sentence is correct?","choices":["The logistics team is going to delivered the new equipment on Thursday.","The logistics team are going to deliver the new equipment on Thursday.","The logistics team is going to deliver the new equipment on Thursday.","The logistics team is going deliver to the new equipment on Thursday."],"answer":2,"explanation":"Singular: is. After going to: base verb deliver (not delivered). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["I am not going to attending the briefing tomorrow.","I am not going to attend the briefing tomorrow.","I is not going to attend the briefing tomorrow.","I am going to not attend the briefing tomorrow."],"answer":1,"explanation":"I \u2192 am. After going to: base verb attend (not attending). 'Not' before 'going to'."},{"question":"Which sentence is correct?","choices":["Are the security officers going to conducts a surprise inspection tomorrow?","Is the security officers going to conduct a surprise inspection tomorrow?","Are the security officers going to conduct a surprise inspection tomorrow?","Do the security officers going to conduct a surprise inspection tomorrow?"],"answer":2,"explanation":"Plural: Are. After going to: base verb conduct (not conducts)."},{"question":"Which sentence is correct?","choices":["The perimeter sensor is beeping \u2014 it is going to triggered an alert!","The perimeter sensor is beeping \u2014 it are going to trigger an alert!","The perimeter sensor is beeping \u2014 it is going triggered to an alert!","The perimeter sensor is beeping \u2014 it is going to trigger an alert!"],"answer":3,"explanation":"Singular: is. After going to: base verb trigger (not triggered). Full structure: going TO + base verb."},{"question":"Which sentence is correct?","choices":["The officers are going to conduct a surprise inspection tomorrow to morning.","The officers are going to conduct a surprise inspection tomorrow morning.","The officers is going to conduct a surprise inspection tomorrow morning.","The officers are going to conducts a surprise inspection tomorrow morning."],"answer":1,"explanation":"'Tomorrow morning' needs no preposition. Plural: are. After going to: base verb conduct (not conducts)."}],"points":10,"explanation":"After going to: always BASE verb (no -s, no -ed). is/are confusion. Missing 'to'. 'Not' before 'going to'. Going to \u2260 gonna in formal writing."}]},{"id":"r1","name":"Why Security Careers Are Rising","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ","type":"reading","question":"Read the text carefully and answer each question.","textContent":"Why Security Careers Are Rising\n\nIn an age marked by rapid global shifts, digital transformation, and new geopolitical challenges, the security sector is undergoing a powerful evolution. From traditional law enforcement to cybersecurity, border control, and corporate protection, security jobs are no longer just about brute strength or surveillance - they're about intelligence, strategy, and adaptability. Governments and private companies alike are ramping up their security operations, and this trend shows no signs of slowing down.\n\nA key player in the European security infrastructure is the European Border and Coast Guard Agency - better known as Frontex. While most people associate Frontex with uniformed border guards, the organization also offers vital administrative roles. These Frontex vacancies provide a pathway into international service for professionals with backgrounds in HR, finance, law, policy, communications, and IT. Preparing for a Frontex interview requires a solid understanding of EU regulations, cross-border cooperation, and crisis management - but the rewards are substantial, including stability, career growth, and the prestige of working at the heart of European security.\n\nThe Expanding Landscape of Security Jobs\n\nSecurity today is multifaceted. From airport screening staff and cybersecurity analysts to risk assessment consultants and emergency preparedness coordinators, the opportunities stretch across nearly every industry and continent. Even sectors once considered unrelated to security - like healthcare, education, and logistics - now have critical safety and risk management roles to fill.\n\nWhy the surge? It comes down to three key factors:\n\n1. Increased Threat Awareness: Global incidents like cyberattacks, pandemics, terrorism, and political instability have forced organizations to rethink risk in all dimensions.\n\n2. Regulatory Pressure: Governments are tightening compliance requirements around data protection, workplace safety, and crisis response.\n\n3. Technology Integration: AI surveillance, biometric scanning, threat detection software - the tools are advancing, and so is the need for skilled people to manage them.","questions":[{"question":"1. Why are security careers evolving today?","choices":["A. They are becoming less useful","B. Because of global and technological changes","C. Because companies are closing","D. Thanks to international tourism"],"answer":1,"explanation":"The sector is evolving due to rapid global shifts and digital transformation."},{"question":"2. How are security jobs described?","choices":["A. Purely physical jobs","B. Jobs limited to the police","C. Jobs requiring intelligence and adaptability","D. Temporary jobs"],"answer":2,"explanation":"Security jobs now require intelligence, strategy, and adaptability."},{"question":"3. What does Frontex illustrate?","choices":["A. Only military can work there","B. Administrative roles play a key part in security","C. Jobs are reserved for students","D. Security only concerns borders"],"answer":1,"explanation":"Frontex also offers vital administrative roles."},{"question":"4. Which skills are important for a Frontex role?","choices":["A. Improvisation only","B. Physical fitness only","C. Regulatory knowledge and cross-border cooperation","D. Working alone permanently"],"answer":2,"explanation":"EU regulations, cross-border cooperation, and crisis management are mentioned."},{"question":"5. Which advantage of a Frontex career is mentioned?","choices":["A. Longer holidays","B. Professional stability and career growth","C. Reduced working hours","D. No responsibilities"],"answer":1,"explanation":"The text highlights stability, career growth, and prestige."},{"question":"6. What does multifaceted security mean?","choices":["A. Security covers several fields","B. Security is useless","C. Only states deal with security","D. Security depends only on technology"],"answer":0,"explanation":"Security now spans many industries and roles."},{"question":"7. Why do sectors like healthcare recruit in security?","choices":["A. To replace employees","B. Because safety and risk management are essential","C. To reduce costs","D. They are abandoning their main activities"],"answer":1,"explanation":"Healthcare, education, and logistics now have critical safety roles."},{"question":"8. What is the first key factor explaining the surge?","choices":["A. Decline in international trade","B. Disappearance of new technologies","C. Increased awareness of global risks","D. Fewer regulations"],"answer":2,"explanation":"Increased Threat Awareness is the first key factor."},{"question":"9. How do new technologies influence security?","choices":["A. They eliminate the need for staff","B. They create new needs for specialised skills","C. They make training unnecessary","D. They replace all cooperation"],"answer":1,"explanation":"Tools advance and so does the need for skilled people."},{"question":"10. What is the main idea of the text?","choices":["A. Security careers are in decline","B. Security is becoming a strategic and diverse field","C. Companies refuse to invest in security","D. Global risks have disappeared"],"answer":1,"explanation":"Security is growing in scope, importance, and diversity."}],"points":10},{"name":"Reading - True / False","type":"reading","question":"Read the text and decide: True or False?","textContent":"Why Security Careers Are Rising\n\nIn an age marked by rapid global shifts, digital transformation, and new geopolitical challenges, the security sector is undergoing a powerful evolution. From traditional law enforcement to cybersecurity, border control, and corporate protection, security jobs are no longer just about brute strength or surveillance - they're about intelligence, strategy, and adaptability. Governments and private companies alike are ramping up their security operations, and this trend shows no signs of slowing down.\n\nA key player in the European security infrastructure is the European Border and Coast Guard Agency - better known as Frontex. While most people associate Frontex with uniformed border guards, the organization also offers vital administrative roles. These Frontex vacancies provide a pathway into international service for professionals with backgrounds in HR, finance, law, policy, communications, and IT. Preparing for a Frontex interview requires a solid understanding of EU regulations, cross-border cooperation, and crisis management - but the rewards are substantial, including stability, career growth, and the prestige of working at the heart of European security.\n\nThe Expanding Landscape of Security Jobs\n\nSecurity today is multifaceted. From airport screening staff and cybersecurity analysts to risk assessment consultants and emergency preparedness coordinators, the opportunities stretch across nearly every industry and continent. Even sectors once considered unrelated to security - like healthcare, education, and logistics - now have critical safety and risk management roles to fill.\n\nWhy the surge? It comes down to three key factors:\n\n1. Increased Threat Awareness: Global incidents like cyberattacks, pandemics, terrorism, and political instability have forced organizations to rethink risk in all dimensions.\n\n2. Regulatory Pressure: Governments are tightening compliance requirements around data protection, workplace safety, and crisis response.\n\n3. Technology Integration: AI surveillance, biometric scanning, threat detection software - the tools are advancing, and so is the need for skilled people to manage them.","questions":[{"question":"1. Security jobs are only about physical surveillance.","choices":["True","False"],"answer":1,"explanation":"False - security is now about intelligence, strategy, and adaptability."},{"question":"2. Private companies also invest in security operations.","choices":["True","False"],"answer":0,"explanation":"True - governments and private companies alike are ramping up security."},{"question":"3. Frontex only employs uniformed border guards.","choices":["True","False"],"answer":1,"explanation":"False - Frontex also offers vital administrative roles."},{"question":"4. Knowledge of EU regulations is useful in the security sector.","choices":["True","False"],"answer":0,"explanation":"True - EU regulations are mentioned as important for Frontex roles."},{"question":"5. Security opportunities are limited to borders and airports.","choices":["True","False"],"answer":1,"explanation":"False - security spans nearly every industry and continent."},{"question":"6. The healthcare sector now has security-related needs.","choices":["True","False"],"answer":0,"explanation":"True - healthcare, education, and logistics are mentioned."},{"question":"7. Global threats have decreased according to the text.","choices":["True","False"],"answer":1,"explanation":"False - global incidents have forced organisations to rethink risk."},{"question":"8. AI surveillance is mentioned as a technological development.","choices":["True","False"],"answer":0,"explanation":"True - AI surveillance, biometric scanning, and threat detection are cited."},{"question":"9. Frontex careers are described as unstable and unattractive.","choices":["True","False"],"answer":1,"explanation":"False - the text highlights stability, career growth, and prestige."},{"question":"10. The demand for skilled staff grows alongside technology.","choices":["True","False"],"answer":0,"explanation":"True - as tools advance, so does the need for skilled people."}],"points":10}]},{"id":"v7","name":"Human Resources","category":"vocab","vocab":"Recrutement = Recruitment\nCandidat = Candidate\nEntretien d'embauche = Job interview\nCV = Resume / CV\nLettre de motivation = Cover letter\nEmployeur = Employer\nEmploye = Employee\nContrat de travail = Employment contract\nSalaire = Salary\nPrime = Bonus\nHeures supplementaires = Overtime\nTemps plein = Full-time\nTemps partiel = Part-time\nHoraires de travail = Working hours\nFormation = Training\nCompetence = Skill\nExperience professionnelle = Work experience\nPromotion = Promotion\nEvaluation des performances = Performance appraisal\nConges payes = Paid leave\nArret maladie = Sick leave\nRetraite = Retirement\nDemission = Resignation\nLicenciement = Dismissal\nPeriode d'essai = Probation period\nEquipe = Team\nResponsable = Manager\nDepartement RH = HR department\nOffre d'emploi = Job offer\nPoste vacant = Vacancy","exercises":[{"name":"Match - Human Resources (1)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Recruitment","right":"Recrutement"},{"left":"Candidate","right":"Candidat"},{"left":"Job interview","right":"Entretien d'embauche"},{"left":"Resume / CV","right":"CV"},{"left":"Cover letter","right":"Lettre de motivation"},{"left":"Employer","right":"Employeur"},{"left":"Employee","right":"Employe"},{"left":"Employment contract","right":"Contrat de travail"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Human Resources (2)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Salary","right":"Salaire"},{"left":"Bonus","right":"Prime"},{"left":"Overtime","right":"Heures supplementaires"},{"left":"Full-time","right":"Temps plein"},{"left":"Part-time","right":"Temps partiel"},{"left":"Working hours","right":"Horaires de travail"},{"left":"Training","right":"Formation"},{"left":"Skill","right":"Competence"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Human Resources (3)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Work experience","right":"Experience professionnelle"},{"left":"Promotion","right":"Promotion"},{"left":"Performance appraisal","right":"Evaluation des performances"},{"left":"Paid leave","right":"Conges payes"},{"left":"Sick leave","right":"Arret maladie"},{"left":"Retirement","right":"Retraite"},{"left":"Resignation","right":"Demission"},{"left":"Dismissal","right":"Licenciement"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Human Resources (4)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Probation period","right":"Periode d'essai"},{"left":"Team","right":"Equipe"},{"left":"Manager","right":"Responsable"},{"left":"HR department","right":"Departement RH"},{"left":"Job offer","right":"Offre d'emploi"},{"left":"Vacancy","right":"Poste vacant"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"QCM - Human Resources","type":"qcm_sequence","questions":[{"question":"The ___ is responsible for finding and selecting new employees.","choices":["employee","HR department","candidate","vacancy"],"answer":1,"explanation":"The HR department handles recruitment and selection."},{"question":"A ___ is sent to apply for a job, alongside a CV.","choices":["job offer","cover letter","employment contract","performance appraisal"],"answer":1,"explanation":"A cover letter accompanies a CV when applying for a job."},{"question":"An employee who works 35 hours a week is ___.","choices":["part-time","on probation","full-time","in retirement"],"answer":2,"explanation":"Full-time means working the standard number of hours per week."},{"question":"The ___ sets out the terms and conditions of employment.","choices":["bonus","vacancy","employment contract","job interview"],"answer":2,"explanation":"An employment contract defines the legal terms of employment."},{"question":"Extra hours worked beyond the normal schedule are called ___.","choices":["paid leave","overtime","sick leave","training"],"answer":1,"explanation":"Overtime refers to hours worked beyond standard working hours."},{"question":"A ___ is a financial reward given in addition to the basic salary.","choices":["vacancy","promotion","bonus","dismissal"],"answer":2,"explanation":"A bonus is an additional payment rewarding performance."},{"question":"The ___ is the period at the start of a job when the employer assesses the employee.","choices":["paid leave","probation period","sick leave","retirement"],"answer":1,"explanation":"The probation period allows both parties to assess suitability."},{"question":"A ___ occurs when an employee is forced to leave their job by the employer.","choices":["resignation","retirement","dismissal","promotion"],"answer":2,"explanation":"Dismissal means the employer ends the employment relationship."},{"question":"A ___ is an upward move to a higher position within a company.","choices":["training","skill","probation period","promotion"],"answer":3,"explanation":"A promotion means moving to a higher-level position."},{"question":"The regular review of an employee's work quality and results is called a ___.","choices":["performance appraisal","job interview","vacancy","dismissal"],"answer":0,"explanation":"A performance appraisal evaluates an employee's work and results."}],"points":10,"explanation":"Review human resources vocabulary."}]},{"id":"v8","name":"Management","category":"vocab","vocab":"Manager = Manager\nChef d'equipe = Team leader\nEntreprise = Company\nObjectif = Goal\nStrategie = Strategy\nPlanification = Planning\nProjet = Project\nReunion = Meeting\nDecision = Decision\nResponsabilite = Responsibility\nLeadership = Leadership\nCommunication = Communication\nTravail d'equipe = Teamwork\nDelegation = Delegation\nMotivation = Motivation\nPerformance = Performance\nProductivite = Productivity\nGestion du temps = Time management\nResolution de problemes = Problem solving\nPrise de decision = Decision-making\nConflit = Conflict\nNegociation = Negotiation\nClient = Customer\nSatisfaction client = Customer satisfaction\nQualite = Quality\nAmelioration continue = Continuous improvement\nCollaboration = Collaboration\nOrganisation = Organisation","exercises":[{"name":"Match - Management (1)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Manager","right":"Manager"},{"left":"Team leader","right":"Chef d'equipe"},{"left":"Company","right":"Entreprise"},{"left":"Goal","right":"Objectif"},{"left":"Strategy","right":"Strategie"},{"left":"Planning","right":"Planification"},{"left":"Project","right":"Projet"},{"left":"Meeting","right":"Reunion"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Management (2)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Decision","right":"Decision"},{"left":"Responsibility","right":"Responsabilite"},{"left":"Leadership","right":"Leadership"},{"left":"Communication","right":"Communication"},{"left":"Teamwork","right":"Travail d'equipe"},{"left":"Delegation","right":"Delegation"},{"left":"Motivation","right":"Motivation"},{"left":"Performance","right":"Performance"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Management (3)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Productivity","right":"Productivite"},{"left":"Time management","right":"Gestion du temps"},{"left":"Problem solving","right":"Resolution de problemes"},{"left":"Decision-making","right":"Prise de decision"},{"left":"Conflict","right":"Conflit"},{"left":"Negotiation","right":"Negociation"},{"left":"Customer","right":"Client"},{"left":"Customer satisfaction","right":"Satisfaction client"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - Management (4)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Quality","right":"Qualite"},{"left":"Continuous improvement","right":"Amelioration continue"},{"left":"Collaboration","right":"Collaboration"},{"left":"Organisation","right":"Organisation"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"QCM - Management","type":"qcm_sequence","questions":[{"question":"The ability to guide and inspire a team towards a common goal is called ___.","choices":["delegation","conflict","leadership","productivity"],"answer":2,"explanation":"Leadership is the ability to motivate and guide people effectively."},{"question":"Assigning tasks and authority to team members is called ___.","choices":["negotiation","delegation","planning","decision-making"],"answer":1,"explanation":"Delegation means giving responsibility and authority to others."},{"question":"___ refers to the amount of work produced in a given time.","choices":["Quality","Productivity","Motivation","Communication"],"answer":1,"explanation":"Productivity measures the efficiency of work output."},{"question":"The process of finding solutions to problems is called ___.","choices":["time management","customer satisfaction","problem solving","continuous improvement"],"answer":2,"explanation":"Problem solving involves identifying and resolving issues effectively."},{"question":"___ involves discussing and reaching a mutually acceptable agreement.","choices":["Conflict","Collaboration","Negotiation","Leadership"],"answer":2,"explanation":"Negotiation is the process of reaching agreement through discussion."},{"question":"A ___ brings team members together to discuss projects and make decisions.","choices":["meeting","goal","strategy","project"],"answer":0,"explanation":"A meeting is a gathering to discuss work matters."},{"question":"An ongoing effort to improve products, services, and processes is called ___.","choices":["delegation","continuous improvement","time management","decision-making"],"answer":1,"explanation":"Continuous improvement means always looking for better ways of working."},{"question":"The process of setting goals and organising resources to achieve them is ___.","choices":["conflict","planning","teamwork","performance"],"answer":1,"explanation":"Planning involves setting objectives and preparing how to reach them."},{"question":"___ measures how well an individual or team achieves their goals.","choices":["Delegation","Motivation","Performance","Collaboration"],"answer":2,"explanation":"Performance is the measure of how well objectives are met."},{"question":"A ___ is a disagreement or dispute between individuals or groups.","choices":["goal","project","conflict","decision"],"answer":2,"explanation":"A conflict is a disagreement that needs to be resolved."}],"points":10,"explanation":"Review management vocabulary."}]},{"id":"v9","name":"CSR","category":"vocab","vocab":"RSE = CSR\nDeveloppement durable = Sustainable development\nEmpreinte carbone = Carbon footprint\nEmissions de CO2 = CO2 emissions\nRecyclage = Recycling\nGestion des dechets = Waste management\nEnergies renouvelables = Renewable energy\nEconomie d'energie = Energy saving\nBiodiversite = Biodiversity\nPollution = Pollution\nEthique = Ethics\nDiversite = Diversity\nInclusion = Inclusion\nEgalite des chances = Equal opportunities\nBien-etre au travail = Workplace well-being\nSante et securite = Health and safety\nConditions de travail = Working conditions\nCommerce equitable = Fair trade\nChaine d'approvisionnement = Supply chain\nPartie prenante = Stakeholder\nTransparence = Transparency\nGouvernance = Governance\nEngagement = Commitment\nBenevolat = Volunteering\nImpact social = Social impact\nODD = SDGs\nNeutralite carbone = Carbon neutrality\nConsommation responsable = Responsible consumption","exercises":[{"name":"Match - CSR (1)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"CSR","right":"RSE"},{"left":"Sustainable development","right":"Developpement durable"},{"left":"Carbon footprint","right":"Empreinte carbone"},{"left":"CO2 emissions","right":"Emissions de CO2"},{"left":"Recycling","right":"Recyclage"},{"left":"Waste management","right":"Gestion des dechets"},{"left":"Renewable energy","right":"Energies renouvelables"},{"left":"Energy saving","right":"Economie d'energie"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - CSR (2)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Biodiversity","right":"Biodiversite"},{"left":"Pollution","right":"Pollution"},{"left":"Ethics","right":"Ethique"},{"left":"Diversity","right":"Diversite"},{"left":"Inclusion","right":"Inclusion"},{"left":"Equal opportunities","right":"Egalite des chances"},{"left":"Workplace well-being","right":"Bien-etre au travail"},{"left":"Health and safety","right":"Sante et securite"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - CSR (3)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Working conditions","right":"Conditions de travail"},{"left":"Fair trade","right":"Commerce equitable"},{"left":"Supply chain","right":"Chaine d'approvisionnement"},{"left":"Stakeholder","right":"Partie prenante"},{"left":"Transparency","right":"Transparence"},{"left":"Governance","right":"Gouvernance"},{"left":"Commitment","right":"Engagement"},{"left":"Volunteering","right":"Benevolat"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"Match - CSR (4)","type":"match","question":"Match each term to its equivalent.","leftLabel":"English","rightLabel":"French","pairs":[{"left":"Social impact","right":"Impact social"},{"left":"SDGs","right":"ODD"},{"left":"Carbon neutrality","right":"Neutralite carbone"},{"left":"Responsible consumption","right":"Consommation responsable"}],"points":10,"explanation":"Review the vocabulary list."},{"name":"QCM - CSR","type":"qcm_sequence","questions":[{"question":"___ refers to a company's voluntary actions to have a positive social and environmental impact.","choices":["Governance","CSR","Supply chain","Carbon footprint"],"answer":1,"explanation":"CSR = Corporate Social Responsibility."},{"question":"The total greenhouse gases produced by human activity is called the ___.","choices":["biodiversity","carbon footprint","recycling","fair trade"],"answer":1,"explanation":"The carbon footprint measures environmental impact."},{"question":"Using wind, solar, or water power instead of fossil fuels is called ___.","choices":["waste management","recycling","renewable energy","carbon neutrality"],"answer":2,"explanation":"Renewable energy comes from naturally replenished sources."},{"question":"The 17 global goals set by the UN to create a better world by 2030 are the ___.","choices":["SDGs","CSR","Working conditions","Stakeholders"],"answer":0,"explanation":"The SDGs (Sustainable Development Goals) were adopted by the UN in 2015."},{"question":"A company achieves ___ when it removes as much CO2 as it produces.","choices":["fair trade","workplace well-being","carbon neutrality","governance"],"answer":2,"explanation":"Carbon neutrality means balancing CO2 emissions with equivalent reductions."},{"question":"Treating people of all backgrounds equally in recruitment is called ___.","choices":["volunteering","equal opportunities","transparency","supply chain"],"answer":1,"explanation":"Equal opportunities means no discrimination."},{"question":"___ refers to all organisations involved in creating and delivering a product.","choices":["Stakeholder","Supply chain","Social impact","Recycling"],"answer":1,"explanation":"The supply chain includes suppliers, manufacturers, and distributors."},{"question":"A person or group affected by a company's activities is a ___.","choices":["stakeholder","commitment","governance","employee"],"answer":0,"explanation":"Stakeholders include employees, customers, and communities."},{"question":"The way a company is directed and controlled by its leaders is called ___.","choices":["diversity","governance","inclusion","ethics"],"answer":1,"explanation":"Governance refers to systems and processes of company leadership."},{"question":"The variety of people with different backgrounds in an organisation is ___.","choices":["commitment","transparency","diversity","CSR"],"answer":2,"explanation":"Diversity means having a mix of people from varied backgrounds."}],"points":10,"explanation":"Review csr vocabulary."}]},{"id":"v10","name":"Risk Management","category":"vocab","vocab":"Gestion des risques = Risk management\nRisque = Risk\nMenace = Threat\nDanger = Hazard\nVulnerabilite = Vulnerability\nPrevention = Prevention\nEvaluation des risques = Risk assessment\nAnalyse des risques = Risk analysis\nPlan de prevention = Prevention plan\nPlan d'urgence = Emergency plan\nPlan de continuite d'activite = BCP\nGestion de crise = Crisis management\nIncident = Incident\nAccident = Accident\nMesures de securite = Security measures\nProcedure = Procedure\nAudit = Audit\nConformite = Compliance\nReglementation = Regulation\nSurveil  is called ___.","choices":["awareness","prevention","monitoring","evacuation"],"answer":2,"explanation":"Monitoring involves continuous observation to detect changes."},{"question":"Training employees about risks so they can avoid them is called ___.","choices":["inspection","awareness","accident","BCP"],"answer":1,"explanation":"Awareness training helps people recognise and respond to risks."},{"question":"The coordinated approach to managing a major disruptive event is called ___.","choices":["risk analysis","audit","crisis management","procedure"],"answer":2,"explanation":"Crisis management responds to and recovers from serious incidents."}],"points":10,"explanation":"Review risk management vocabulary."}]},{"id":"v11","name":"Tasks & Missions","category":"vocab","vocab":"Surveillance = Surveillance\nPatrouille = Patrol\nControle d'acces = Access control\nVerification d'identite = ID check\nFouille de sac = Bag search\nSurveiller cameras CCTV = Monitor CCTV cameras\nRepondre aux incidents = Respond to incidents\nRediger un rapport d'incident = Write an incident report\nProteger les personnes = Protect people\nProteger les biens = Protect property\nPrevenir le vol = Prevent theft\nPrevenir le vandalisme = Prevent vandalism\nDetecter comportement suspect = Detect suspicious behaviour\nGerer les urgences = Manage emergencies\nEvacuer un batiment = Evacuate a building\nFournir les premiers secours = Provide first aid\nAppeler les services d'urgence = Call emergency services\nControler acces vehicules = Control vehicle access\nSecuriser un site = Secure a site\nVerifier systemes d'alarme = Check alarm systems\nInspecter equipements securite = Inspect security equipment\nGuider les visiteurs = Guide visitors\nGerer les conflits = Manage conflicts\nDesamorcer une situation = De-escalate a situation\nSignaler activite suspecte = Report suspicious activity\nMaintenir environnement sur = Maintain a safe environment","exercises":[{"name":"Match - Tasks & Missions (1)","type st participle."},{"sentence":"Who should workplace harassment reported to?","errorWord":"reported","correction":"be reported","explanation":"Passive: should + BE + past participle: should be reported to."},{"sentence":"Where informations about workplace rules can employees find?","errorWord":"informations","correction":"information","explanation":"Information is uncountable - no plural -s."},{"sentence":"How often does the company reviews its health and safety policy?","errorWord":"reviews","correction":"review","explanation":"After does: base verb -> review (not reviews)."},{"sentence":"How is the overtime rate calculate for security officers?","errorWord":"calculate","correction":"calculated","explanation":"Passive: How is the overtime rate CALCULATED (past participle)?"},{"sentence":"Why is it important to arrives on time for each shift?","errorWord":"arrives","correction":"arrive","explanation":"After 'to': base verb -> to arrive (not to arrives)."},{"sentence":"What does it mean to be in a probation period?","errorWord":"in","correction":"on","explanation":"Correct expression: to be ON a probation period (not 'in')."},{"sentence":"How many days do employees needs to wait before requesting annual leave?","errorWord":"needs","correction":"need","explanation":"After do: base verb -> need (not needs)."},{"sentence":"When employees must notify their manager if they will be absent?","errorWord":"employees","correction":"must employees","explanation":"Correct order: When + must + subject + base verb: When must employees notify?"},{"sentence":"What benefits does the company offer it to its security officers?","errorWord":"it","correction":"","explanation":"Remove redundant 'it': What benefits does the company offer to its security officers?"},{"sentence":"Where can employees raise a grievance if they feel unfairly treated have been?","errorWord":"treated","correction":"have been treated","explanation":"Correct order of passive perfect: have been treated (not treated have been)."}],"points":10,"explanation":"Passive (be + past participle), base verb after auxiliary, uncountable nouns, subject-auxiliary inversion, correct prepositions."}]},{"id":"r2","name":"Who Should Consider a Career in Security?","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ (10Q)","type":"reading","question":"Read the text carefully and answer each question.","textContent":"Who Should Consider a Career in Security?\n\nSecurity roles aren't limited to those with military or law enforcement backgrounds. In fact, the modern security workforce is highly diverse, encompassing people from disciplines like:\n- Information technology (cybersecurity and data protection)\n- Psychology and social work (threat assessment and crisis counseling)\n- Public administration (emergency planning, diplomacy, policy analysis)\n- Engineering and infrastructure (physical site security, risk engineering)\n- Communications (strategic messaging during crises)\n\nIf you're someone who values mission-driven work, thrives under pressure, and wants to contribute to a safer world, a security career could be a perfect match.\n\nEntry Points: From Local Roles to International Agencies\n\nDepending on your goals, you can enter the field through multiple pathways:\n- Private Sector: Corporate security departments often recruit talent from business, law, and tech backgrounds to manage internal risk.\n- Government Agencies: Roles in homeland security, intelligence, customs, and defense offer training and long-term career ladders.\n- International Organizations: Agencies like the United Nations, NATO, and the European Union offer global security positions with far-reaching impact.\n\nRegardless of the entry point, what matters most is skill-building. Certifications such as CISSP (Certified Information Systems Security Professional), CTPAT (Customs-Trade Partnership Against Terrorism), or CPP (Certified Protection Professional) can boost credibility and earnings potential.\n\nThe Rise of Administrative Security Roles\n\nWhile frontline personnel are vital, the brains behind any security operation often sit in administrative and strategic positions. These roles ensure smooth coordination, funding, legal compliance, and effective communication. Think operations officers, budget analysts, legal advisors, recruitment coordinators, and digital strategists.\n\nAdministrative careers in security are especially attractive because they:\n- Offer long-term stability\n- Tend to be less physically demanding\n- Allow for upward mobility into leadership\n- Attract professionals from non-traditional backgrounds\n\nThis shift creates space for people who may not have a policing background but bring valuable administrative, analytical, or policy expertise.\n\nRemote and Tech-Based Security Jobs\n\nThe remote work boom has also impacted security careers. Many roles can now be done partially or fully online - particularly in threat analysis, cybersecurity, and compliance monitoring. Tech-savvy professionals can find opportunities to:\n- Monitor digital threats and vulnerabilities\n- Analyze intelligence from satellite feeds and sensors\n- Coordinate logistics and incident responses from afar\n- Train others via online platforms or virtual simulations\n\nAI and machine learning are further transforming security tasks. Predictive policing, facial recognition, and automated anomaly detection are just the beginning. The professionals of tomorrow will need to be agile, ethical, and constantly learning.","questions":[{"question":"1. What is the main idea the text develops about security careers?","choices":["A. They are reserved for military personnel","B. They concern a wide variety of profiles","C. They are progressively disappearing","D. They are exclusively physical"],"answer":1,"explanation":"The text states the modern security workforce is highly diverse, encompassing people from many disciplines."},{"question":"2. According to the text, what type of person may be attracted to a security career?","choices":["A. People looking for work without responsibilities","B. People motivated by work that is useful to society","C. People who refuse teamwork","D. People wanting to avoid all pressure"],"answer":1,"explanation":"The text mentions those who 'value mission-driven work, thrive under pressure, and want to contribute to a safer world'."},{"question":"3. What does the diversity of disciplines mentioned in the text show?","choices":["A. Security depends only on technology","B. Security requires multiple skills","C. Administrative roles are useless","D. Human skills are no longer needed"],"answer":1,"explanation":"The wide range of disciplines \u2014 IT, psychology, engineering, communications \u2014 shows security requires multiple skills."},{"question":"4. What seems essential to succeed in the security sector?","choices":["A. Luck","B. Family connections","C. Skill-building","D. Physical strength only"],"answer":2,"explanation":"The text states 'what matters most is skill-building'."},{"question":"5. Why are certifications mentioned in the text?","choices":["A. Because they replace experience","B. Because they can improve career prospects","C. Because they are compulsory in all roles","D. Because they reduce training time"],"answer":1,"explanation":"The text says certifications 'can boost credibility and earnings potential'."},{"question":"6. How are administrative roles presented in the text?","choices":["A. As secondary and of little use","B. As essential to the smooth running of operations","C. As reserved for beginners","D. As temporary positions"],"answer":1,"explanation":"The text says these roles 'ensure smooth coordination, funding, legal compliance, and effective communication'."},{"question":"7. Why do administrative security careers attract certain people?","choices":["A. Because they require few skills","B. Because they offer stability and career progression","C. Because they avoid teamwork entirely","D. Because they are only accessible remotely"],"answer":1,"explanation":"The text lists stability, less physical demand, upward mobility, and attracting non-traditional backgrounds."},{"question":"8. What recent change is influencing security careers?","choices":["A. The disappearance of digital technologies","B. The development of remote working","C. The reduction in cybersecurity needs","D. The closure of international organisations"],"answer":1,"explanation":"The text states 'the remote work boom has also impacted security careers'."},{"question":"9. What must tomorrow's security professionals develop?","choices":["A. A complete dependence on machines","B. A rigid and repetitive attitude","C. Adaptability and continuous learning","D. A single specialisation with no evolution"],"answer":2,"explanation":"The text says professionals 'will need to be agile, ethical, and constantly learning'."},{"question":"10. What general vision of security careers does the text present?","choices":["A. A closed and limited field","B. A modern sector undergoing major transformation","C. A sector reserved for the military","D. A field with no professional future"],"answer":1,"explanation":"The text presents security as a diverse, growing, and technologically evolving field."}],"points":10},{"name":"Reading - True / False","type":"reading","question":"Read the text and decide: True or False?","textContent":"Who Should Consider a Career in Security?\n\nSecurity roles aren't limited to those with military or law enforcement backgrounds. In fact, the modern security workforce is highly diverse, encompassing people from disciplines like:\n- Information technology (cybersecurity and data protection)\n- Psychology and social work (threat assessment and crisis counseling)\n- Public administration (emergency planning, diplomacy, policy analysis)\n- Engineering and infrastructure (physical site security, risk engineering)\n- Communications (strategic messaging during crises)\n\nIf you're someone who values mission-driven work, thrives under pressure, and wants to contribute to a safer world, a security career could be a perfect match.\n\nEntry Points: From Local Roles to International Agencies\n\nDepending on your goals, you can enter the field through multiple pathways:\n- Private Sector: Corporate security departments often recruit talent from business, law, and tech backgrounds to manage internal risk.\n- Government Agencies: Roles in homeland security, intelligence, customs, and defense offer training and long-term career ladders.\n- International Organizations: Agencies like the United Nations, NATO, and the European Union offer global security positions with far-reaching impact.\n\nRegardless of the entry point, what matters most is skill-building. Certifications such as CISSP (Certified Information Systems Security Professional), CTPAT (Customs-Trade Partnership Against Terrorism), or CPP (Certified Protection Professional) can boost credibility and earnings potential.\n\nThe Rise of Administrative Security Roles\n\nWhile frontline personnel are vital, the brains behind any security operation often sit in administrative and strategic positions. These roles ensure smooth coordination, funding, legal compliance, and effective communication. Think operations officers, budget analysts, legal advisors, recruitment coordinators, and digital strategists.\n\nAdministrative careers in security are especially attractive because they:\n- Offer long-term stability\n- Tend to be less physically demanding\n- Allow for upward mobility into leadership\n- Attract professionals from non-traditional backgrounds\n\nThis shift creates space for people who may not have a policing background but bring valuable administrative, analytical, or policy expertise.\n\nRemote and Tech-Based Security Jobs\n\nThe remote work boom has also impacted security careers. Many roles can now be done partially or fully online - particularly in threat analysis, cybersecurity, and compliance monitoring. Tech-savvy professionals can find opportunities to:\n- Monitor digital threats and vulnerabilities\n- Analyze intelligence from satellite feeds and sensors\n- Coordinate logistics and incident responses from afar\n- Train others via online platforms or virtual simulations\n\nAI and machine learning are further transforming security tasks. Predictive policing, facial recognition, and automated anomaly detection are just the beginning. The professionals of tomorrow will need to be agile, ethical, and constantly learning.","questions":[{"question":"1. The text states that only former military personnel can work in security.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text says security roles 'aren't limited to those with military or law enforcement backgrounds'."},{"question":"2. Communication skills can be useful in security careers.","choices":["True","False"],"answer":0,"explanation":"True \u2014 communications (strategic messaging during crises) is listed as one of the relevant disciplines."},{"question":"3. International organisations also offer careers in security.","choices":["True","False"],"answer":0,"explanation":"True \u2014 the UN, NATO, and the EU are mentioned as offering global security positions."},{"question":"4. The text emphasises the importance of skill-building.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'what matters most is skill-building' is stated clearly in the text."},{"question":"5. Administrative roles are described as useless in security operations.","choices":["True","False"],"answer":1,"explanation":"False \u2014 they are described as essential for coordination, funding, compliance, and communication."},{"question":"6. Administrative security careers are described as physically demanding.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text says they 'tend to be less physically demanding'."},{"question":"7. Remote working now influences some security careers.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'the remote work boom has also impacted security careers'."},{"question":"8. New technologies are gradually transforming the security sector.","choices":["True","False"],"answer":0,"explanation":"True \u2014 AI, machine learning, facial recognition, and predictive policing are all mentioned."},{"question":"9. The text suggests that professionals will need to keep learning.","choices":["True","False"],"answer":0,"explanation":"True \u2014 'constantly learning' is explicitly mentioned."},{"question":"10. The text presents security careers as a declining field.","choices":["True","False"],"answer":1,"explanation":"False \u2014 the text presents security as a growing and transforming sector."}],"points":10}]},{"id":"r4","name":"Site Security - Invitation to Tender","category":"reading","vocab":"","exercises":[{"name":"Reading - MCQ (15Q)","type":"reading","question":"Read the document carefully and answer each question.","textContent":"NOTICE OF CONTRACTING OPPORTUNITY - SITE SECURITY - INVITATION TO TENDER\n\nTuesday, January 3, 2023\n\nSolicitation No. 476721-0068\nRegional Procurement Strategy for Indigenous Businesses\n\nParsons, as the Main Construction Manager (MCM) for the Giant Mine Remediation Project (GMRP) and acting as both the Mine Manager and Prime Contractor, will be soliciting a tender for the Site Security for the Giant Mine, Yellowknife, Northwest Territories. This Invitation to Tender is set up as a Regional Procurement Strategy for Indigenous Businesses (PSIB).\n\n(Regional PSIB refers to the initial evaluation of a minimum of two bids whereby the PSIB eligible Bidder's head office is from the Area of the Contract - if no compliant bid can be found from initial evaluation, evaluation of all other PSIB bids continues.)\n\nThe bids must be from PSIB eligible companies.\n\nThis Regional PSIB ITT will include, but is not limited to, the following:\n\n- Provide diligent protection of the Site and assets and restrict public access to the mine Site in accordance with referenced acts, standards, practices, and regulations, and Authorities Having Jurisdiction, using security measures, including but not limited to, security personnel conducting regular patrols to monitor Site for trespassing, vandalism, and theft for 24 hours/day, 365 days/year.\n\n- The work of this contract will require the subcontractor to provide all mobile equipment, including certain pieces of equipment that must be on Site on a full-time basis. Backup equipment does not need to be on the Site on a full-time basis but must be readily available when required.\n\n- Maintain records of activities, record sightings of wildlife on Site, monitor and keep a log of employees working alone as per pre-arranged communication procedures, receive and unload small deliveries by hand at Site gate and notify the Parsons Site Supervisor or office staff of their arrival; these would be limited to mail, courier packages, and similar mailable parcels.\n\n- Subcontractor will provide traffic control professionals to aid in traffic control for the entire site.\n- Subcontractor will procure and implement radio frequency identification program.\n- Subcontractor will provide transportation services between Yellowknife and Giant Mine.\n\nA mandatory pre-bid and site tour meeting will take place January 9, 2023. Work is anticipated to start Spring 2023.\n\nParsons is committed to ensuring procurement is conducted in a fair, open and transparent manner while meeting Comprehensive Land Claims Agreement (CLCA) commitments and the Government of Canada's procurement objectives regarding Indigenous opportunities. Competitive proposals will be solicited using the MERX Canadian Public Tenders website to select the best value firm to deliver the product to the Giant Mine in Yellowknife, Northwest Territories.\n\nAbridged from: https://giantminerp.ca/notice-contracting-opportunity-site-security-invitation-tender","questions":[{"question":"1. What is the main purpose of this document?","choices":["A. To build new buildings","B. To secure and monitor a site","C. To organise tourist visits","D. To train new employees"],"answer":1,"explanation":"The document is an Invitation to Tender for site security services at Giant Mine."},{"question":"2. What type of company is specifically targeted by this tender?","choices":["A. International companies","B. Tourism companies","C. Indigenous businesses from the region","D. Airlines"],"answer":2,"explanation":"The tender is set up as a Regional Procurement Strategy for Indigenous Businesses (PSIB)."},{"question":"3. What is one of the main missions of the subcontractor?","choices":["A. Sell industrial equipment","B. Prevent unauthorised access to the site","C. Repair administrative buildings","D. Organise public events"],"answer":1,"explanation":"The contract requires protection of the site and restricting public access."},{"question":"4. How must site security be provided?","choices":["A. Only during the day","B. Only during construction periods","C. Continuously throughout the year","D. Only at weekends"],"answer":2,"explanation":"The text specifies '24 hours/day, 365 days/year'."},{"question":"5. Why do security officers conduct patrols?","choices":["A. To welcome visitors","B. To check employee working hours","C. To prevent trespassing and vandalism","D. To guide tourists"],"answer":2,"explanation":"Patrols are conducted 'to monitor Site for trespassing, vandalism, and theft'."},{"question":"6. What must the subcontractor provide to carry out its missions?","choices":["A. Housing for employees","B. Mobile equipment","C. Agricultural tools","D. Medical equipment"],"answer":1,"explanation":"The contract requires the subcontractor to provide all mobile equipment."},{"question":"7. What quality is expected from backup equipment?","choices":["A. It must be decorative","B. It must be readily available when needed","C. It must be used every day","D. It must be provided by visitors"],"answer":1,"explanation":"The text states backup equipment 'must be readily available when required'."},{"question":"8. In addition to security, what administrative task is mentioned?","choices":["A. Organising university training","B. Managing records and logs","C. Preparing meals for employees","D. Creating advertising campaigns"],"answer":1,"explanation":"The contract includes maintaining records of activities and keeping logs."},{"question":"9. What shows that the site is located in a natural environment?","choices":["A. Recording wildlife sightings on site","B. The presence of shopping centres","C. The organisation of concerts","D. Employee sports activities"],"answer":0,"explanation":"The contract requires recording 'sightings of wildlife on Site'."},{"question":"10. What employee-related responsibility is mentioned in the text?","choices":["A. Monitoring their holidays","B. Monitoring those who work alone","C. Organising their leisure time","D. Distributing their salaries"],"answer":1,"explanation":"The contract requires keeping 'a log of employees working alone'."},{"question":"11. What logistical activity must the subcontractor also provide?","choices":["A. Transportation between two locations","B. International goods delivery","C. Road construction","D. Management of a seaport"],"answer":0,"explanation":"The text states 'transportation services between Yellowknife and Giant Mine'."},{"question":"12. What other area of expertise is required from the subcontractor?","choices":["A. Collective catering","B. Traffic control","C. Language teaching","D. Hotel management"],"answer":1,"explanation":"The contract requires 'traffic control professionals to aid in traffic control for the entire site'."},{"question":"13. What value is highlighted in the company selection process?","choices":["A. Speed only","B. Secrecy of procedures","C. Fairness and transparency","D. Competition among employees"],"answer":2,"explanation":"Parsons states procurement is 'conducted in a fair, open and transparent manner'."},{"question":"14. Why are competitive proposals invited?","choices":["A. To select the company offering the best value","B. To reduce the number of workers","C. To replace the original project","D. To limit site security"],"answer":0,"explanation":"Competitive proposals are solicited 'to select the best value firm'."},{"question":"15. What general picture of the project does the text give?","choices":["A. A temporary project with no organisation","B. A structured project requiring several support services","C. A simple cultural event","D. An activity reserved for tourists"],"answer":1,"explanation":"The tender covers security, logistics, traffic control, equipment, and administrative tasks \u2014 a structured multi-service project."}],"points":10}]}]</script>
